<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>學習小夥伴</title>
<link rel="icon" href="favicon.ico" sizes="16x16 32x32 48x48">
<link rel="icon" type="image/png" href="icon-512.png" sizes="512x512">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="學習小夥伴">
<meta name="theme-color" content="#fff8ee">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=LXGW+WenKai+TC:wght@400;700&display=swap">
<style>
/* Layout: header with breadcrumb and player chip; one 3D stage that swaps between world (subjects), subject (lessons) and lesson (levels) views; a plain list mirrors the current view below; levels open in a sheet. */
:root{
  --bg:#fff8ee; --surface:#ffffff; --ink:#3d3a4f; --muted:#6a6479; --line:#efe4d2;
  --jade:#2e7d6b; --jade-soft:#d9f2ea; --seal:#c04a35; --seal-soft:#ffe3dc;
  --slip:#fff0c4; --slip-ink:#5a4000; --cord:#e5ae3a;
  --ok:#2f8a55; --ok-soft:#e3f5e8; --bad:#c04a35; --bad-soft:#ffe8e2; --gold:#d99a1e;
  --sky:#d7eef7; --light-k:1; --scrim:rgba(255,248,238,.88);
  --f-kai:"LXGW WenKai TC","Kaiti TC","BiauKai","DFKai-SB","STKaiti","Noto Serif TC",serif;
  --f-round:"Fredoka","PingFang TC","Microsoft JhengHei","Noto Sans TC",system-ui,sans-serif;
  --f-ui:system-ui,-apple-system,"PingFang TC","Microsoft JhengHei","Noto Sans TC",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1e1b26; --surface:#2a2634; --ink:#f2edf7; --muted:#b8b0c6; --line:#3d3848;
  --jade:#7fd1b9; --jade-soft:#24413a; --seal:#ff9c88; --seal-soft:#4a2a26;
  --slip:#4a3f22; --slip-ink:#ffe9a8; --cord:#d9a84a;
  --ok:#7fd69c; --ok-soft:#1f3b2a; --bad:#ff9c88; --bad-soft:#4a2a26; --gold:#f2c55c;
  --sky:#1c2633; --light-k:.5; --scrim:rgba(30,27,38,.9); color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#1e1b26; --surface:#2a2634; --ink:#f2edf7; --muted:#b8b0c6; --line:#3d3848;
  --jade:#7fd1b9; --jade-soft:#24413a; --seal:#ff9c88; --seal-soft:#4a2a26;
  --slip:#4a3f22; --slip-ink:#ffe9a8; --cord:#d9a84a;
  --ok:#7fd69c; --ok-soft:#1f3b2a; --bad:#ff9c88; --bad-soft:#4a2a26; --gold:#f2c55c;
  --sky:#1c2633; --light-k:.5; --scrim:rgba(30,27,38,.9); color-scheme:dark;}

body{background:var(--bg);color:var(--ink);font-family:var(--f-round);font-size:18px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 48px}
.page{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,textarea:focus-visible,input:focus-visible{outline:3px solid var(--jade);outline-offset:2px}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.3}

.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.top h1{font-size:clamp(28px,6.4vw,42px);letter-spacing:.04em}
.top h1 em{font-style:normal;color:var(--seal)}
.crumbs{display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-family:var(--f-ui);font-size:13px;color:var(--muted);letter-spacing:.06em}
.crumbs button{background:none;border:none;padding:0;color:var(--jade);text-decoration:underline;text-underline-offset:3px;font-size:13px}
.crumbs span.sep{opacity:.5}
.chips{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-family:var(--f-ui);font-size:14px;font-variant-numeric:tabular-nums}
.chip button{background:none;border:none;padding:0;color:var(--jade);font-size:13px;text-decoration:underline;text-underline-offset:3px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.ok{background:var(--ok)} .dot.saving{background:var(--gold)} .dot.err,.dot.local{background:var(--seal)}
.star{color:var(--gold)}

.stage{position:relative;height:clamp(380px,62vh,640px);border-radius:28px;overflow:hidden;background:var(--sky);border:1px solid var(--line)}
.stage canvas{display:block;width:100%;height:100%;touch-action:none}
.pins{position:absolute;inset:0;pointer-events:none}
.pin{position:absolute;left:0;top:0;pointer-events:auto;display:flex;align-items:center;gap:6px;padding:3px 10px 3px 3px;border-radius:999px;border:none;
  background:var(--surface);color:var(--ink);box-shadow:0 3px 10px rgba(0,0,0,.18);font-size:15px;white-space:nowrap;will-change:transform;text-align:left;line-height:1.25}
.pin .ps{flex:none;width:26px;height:26px;display:grid;place-items:center;border:2px solid var(--seal);color:var(--seal);border-radius:9px;font-weight:700;font-size:15px}
.pin small{display:block;font-family:var(--f-ui);font-size:11px;color:var(--muted)}
.pin.done .ps{background:var(--seal);color:var(--surface)}
.pin.locked{opacity:.75} .pin.locked .ps{border-color:var(--muted);color:var(--muted)}
.pin.next{animation:pulse 1.6s ease-in-out infinite}
.pin:hover{background:var(--jade-soft)}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--seal) 55%,transparent)}50%{box-shadow:0 0 0 8px color-mix(in srgb,var(--seal) 0%,transparent)}}
.hint{position:absolute;left:12px;bottom:12px;font-family:var(--f-ui);font-size:12px;background:var(--scrim);padding:4px 10px;border-radius:999px;pointer-events:none}
.stage-ctl{position:absolute;right:12px;bottom:10px;display:flex;gap:6px}
.stage-ctl button,.toast{font-family:var(--f-ui);font-size:13px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px 12px}
.toast{position:absolute;left:50%;top:14px;transform:translateX(-50%);pointer-events:none;font-size:15px;box-shadow:0 4px 12px rgba(0,0,0,.15)}
.nogl{display:grid;place-items:center;height:100%;color:var(--muted);padding:20px;text-align:center}
@media (max-width:560px){.pin .pn{display:none}.pin{padding:3px}.hint{display:none}}

.intro{color:var(--muted);margin:0;max-width:62ch}
.list{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.item{display:flex;gap:14px;align-items:center;text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:22px;padding:12px 16px;transition:border-color .15s}
.item:hover{border-color:var(--jade)}
.item .big{flex:none;width:46px;height:46px;display:grid;place-items:center;border:2.5px solid var(--seal);color:var(--seal);border-radius:16px;font-size:24px;font-weight:700}
.item.done .big{background:var(--seal);color:var(--surface)}
.item.locked .big{border-color:var(--muted);color:var(--muted)}
.item b{display:block;font-size:19px}
.item small{display:block;font-family:var(--f-ui);font-size:13px;color:var(--muted)}
.cta{background:var(--jade-soft);border:2px dashed var(--jade);border-radius:22px;padding:16px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}

/* login gate */
#gate{position:fixed;inset:0;z-index:40;background:var(--bg);overflow-y:auto;display:grid;place-items:center;
  padding:calc(20px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.pass{width:min(440px,100%);background:var(--surface);color:var(--ink);border:2px solid var(--line);box-shadow:0 14px 40px rgba(120,96,60,.14);border-radius:32px;padding:28px clamp(18px,5vw,34px);display:flex;flex-direction:column;gap:14px}
.pass h1{font-size:40px;letter-spacing:.2em;text-align:center}
.pass .eyebrow{font-family:var(--f-ui);font-size:12px;letter-spacing:.2em;text-align:center;opacity:.8}
.pass p{margin:0}
.pass input{background:var(--surface);color:var(--ink)}
.pass .recent{display:flex;flex-wrap:wrap;gap:8px}
.pass .recent button{background:var(--bg);color:var(--ink);border:2px solid var(--line);border-radius:999px;padding:4px 14px;font-size:16px}
.pass .note{font-family:var(--f-ui);font-size:13px;opacity:.85}
.pass .status{font-family:var(--f-ui);font-size:13px;display:flex;gap:8px;align-items:center}
.pass .err{color:var(--seal);font-family:var(--f-ui);font-size:14px;min-height:1em}

/* sheet + quiz */
#sheet{position:fixed;inset:0;z-index:30;background:var(--scrim);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);overflow-y:auto;
  padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(32px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
#sheet .wrap{animation:rise .35s ease-out both}
@keyframes rise{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.back{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 14px;font-size:15px;font-family:var(--f-ui);color:var(--muted)}
.bar h2{font-size:24px;flex:1;min-width:0}
.bar h2 small{display:block;font-family:var(--f-ui);font-size:13px;color:var(--muted);font-weight:400;letter-spacing:.08em}
.prog{font-family:var(--f-ui);font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.dots{display:flex;gap:6px}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--jade)}
.card{background:var(--surface);border:2px solid var(--line);border-radius:28px;padding:22px clamp(16px,4vw,28px);display:flex;flex-direction:column;gap:16px;box-shadow:0 10px 30px rgba(120,96,60,.10)}
.lvl-intro{color:var(--muted);margin:0;font-size:16px}
.q{font-size:21px;font-weight:700;margin:0}
.who{display:flex;gap:12px;align-items:center}
.avatar{flex:none;width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-size:24px;font-weight:700;color:var(--surface)}
.avatar.lian{background:var(--seal)} .avatar.lin{background:var(--jade)}
.act{margin:0}
.quote,.slip,.word{font-family:var(--f-kai)}
.quote,.slip{background:var(--slip);color:var(--slip-ink);border-radius:6px;
  background-image:linear-gradient(90deg,transparent 7%,var(--cord) 7%,var(--cord) calc(7% + 2px),transparent calc(7% + 2px),transparent 93%,var(--cord) 93%,var(--cord) calc(93% + 2px),transparent calc(93% + 2px))}
.quote{padding:12px 9%;margin:0;font-size:18px}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;gap:12px;align-items:center;text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:12px 14px;min-height:52px;transition:border-color .15s,background .15s}
.opt:hover:not(:disabled){border-color:var(--jade)}
.optkey{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--jade-soft);color:var(--jade);font-family:var(--f-ui);font-size:14px;font-weight:700}
.opt.picked{border-color:var(--jade);background:var(--jade-soft)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft);opacity:.75}
.opt:disabled{cursor:default}
.slots,.pool{display:flex;flex-direction:column;gap:8px}
.slotrow{display:flex;gap:10px;align-items:center}
.num{flex:none;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--seal);color:var(--seal);font-family:var(--f-ui);font-weight:700;font-size:15px}
.empty{flex:1;min-height:52px;border:2px dashed var(--line);border-radius:6px;display:flex;align-items:center;padding:0 9%;color:var(--muted);font-size:15px}
.slip{flex:1;min-width:0;border:none;text-align:left;padding:12px 9%;min-height:52px;font-size:18px;box-shadow:0 2px 0 var(--cord)}
.slip small{display:block;font-size:14px;opacity:.8}
.slip.right{outline:3px solid var(--ok)} .slip.wrong{outline:3px solid var(--bad)}
.pool-label{font-family:var(--f-ui);font-size:13px;color:var(--muted);letter-spacing:.08em}
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px}
.match .col{display:flex;flex-direction:column;gap:10px;min-width:0}
.tile{position:relative;background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:10px;font-size:20px;min-height:52px}
.tile.sel{border-color:var(--jade);background:var(--jade-soft)}
.tile.done{border-color:var(--ok);background:var(--ok-soft);cursor:default}
.tile.wrong{border-color:var(--bad);background:var(--bad-soft)}
.tile .tag{position:absolute;top:-9px;right:-9px;width:22px;height:22px;border-radius:50%;background:var(--ok);color:var(--surface);font-family:var(--f-ui);font-size:12px;display:grid;place-items:center}
.match.long .tile{font-size:16px;text-align:left;line-height:1.45}
.cloze{margin:0;font-size:19px;line-height:2.4}
.blank{display:inline-block;min-width:4.5em;margin:0 3px;padding:1px 10px;border:none;border-bottom:3px solid var(--jade);border-radius:6px 6px 0 0;background:var(--jade-soft);font-size:18px;line-height:1.6}
.blank.sel{background:var(--seal-soft);border-bottom-color:var(--seal)}
.blank.right{background:var(--ok-soft);border-bottom-color:var(--ok)}
.blank.wrong{background:var(--bad-soft);border-bottom-color:var(--bad)}
.bank{display:flex;flex-wrap:wrap;gap:10px}
.word{background:var(--slip);color:var(--slip-ink);border:none;border-radius:6px;padding:8px 16px;font-size:18px;box-shadow:0 2px 0 var(--cord)}
.word:disabled{opacity:.3;cursor:default}
textarea,input[type=text]{width:100%;box-sizing:border-box;font:inherit;color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:16px;padding:12px}
textarea{min-height:110px;resize:vertical}
.ideas{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.btn{background:var(--jade);color:var(--surface);border:none;border-radius:999px;padding:10px 22px;font-size:18px;font-weight:700;min-height:46px}
.btn:disabled{opacity:.4;cursor:default}
.btn.ghost{background:none;color:var(--jade);border:2px solid var(--jade)}
.btn.red{background:var(--seal)}
.fb{border-radius:20px;padding:12px 14px;font-size:17px}
.fb:empty{display:none}
.fb.ok{background:var(--ok-soft);border-left:5px solid var(--ok)}
.fb.no{background:var(--bad-soft);border-left:5px solid var(--bad)}
.fb strong{display:block;font-size:19px}
.fb .src{display:block;margin-top:8px;padding-top:8px;border-top:2px dashed color-mix(in srgb,currentColor 18%,transparent);font-family:var(--f-ui);font-size:14px;color:var(--muted)}
.fb .ans{display:block;margin:6px 0;font-weight:700}
.fb .warn{display:block;margin:6px 0;color:var(--bad);font-weight:700}
.fb .again{display:block;margin-top:8px;font-family:var(--f-ui);font-size:15px;color:var(--jade)}
.locked{pointer-events:none}
.locked .row,.locked .keypad,.locked .pool-label,.locked #num-help{display:none}
.retest{margin:0;padding:8px 14px;border-radius:16px;background:var(--slip);color:var(--slip-ink);font-family:var(--f-ui);font-size:15px;font-weight:600}
.cta-btns{display:flex;gap:10px;flex-wrap:wrap}
.review{width:100%;text-align:left}
.review ul{margin:6px 0 0;padding-left:1.2em;display:flex;flex-direction:column;gap:10px}
.review li span{display:block;color:var(--muted);font-size:15px}
.chip .me-btn{display:flex;align-items:center;gap:8px;color:inherit;text-decoration:none;font-size:14px}
.me-count{display:inline-flex;align-items:center;gap:3px;color:var(--gold);font-weight:700}
.linkbtn{background:none;border:none;padding:0;color:var(--jade);font:inherit;font-size:15px;text-decoration:underline;text-underline-offset:3px}
.medal-get{display:flex;gap:12px;align-items:center;text-align:left;background:var(--slip);color:var(--slip-ink);border-radius:18px;padding:10px 14px}
.medal-get b{display:block;font-size:18px}
.me-head{display:flex;flex-direction:column;gap:6px}
.me-head .name{font-size:28px;font-weight:700}
.me-sub{margin:10px 0 0;font-size:20px}
.medals{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.medal{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;background:var(--surface);border:2px solid var(--line);border-radius:20px;padding:12px 10px}
.medal:hover{border-color:var(--jade)}
.medal b{font-size:17px;line-height:1.3}
.medal small{font-family:var(--f-ui);font-size:13px;color:var(--muted)}
.medal.locked b{color:var(--muted)}
.done-card{align-items:center;text-align:center;padding-block:36px}
.stamp{width:120px;height:120px;border:5px solid var(--seal);border-radius:14px;display:grid;place-items:center;color:var(--seal);font-size:66px;font-weight:700;transform:rotate(-8deg);animation:stamp .5s cubic-bezier(.2,1.6,.4,1) both}
@keyframes stamp{from{transform:scale(2.2) rotate(-20deg);opacity:0}to{transform:scale(1) rotate(-8deg);opacity:1}}
.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-3px)}}
.edict{background:var(--slip);color:var(--slip-ink);border-radius:10px;padding:28px clamp(18px,5vw,40px);border:3px double var(--cord);display:flex;flex-direction:column;gap:14px;text-align:center}
.edict h2{font-size:30px;letter-spacing:.3em}
.edict .rank{font-size:clamp(26px,6vw,36px);font-weight:700;color:var(--seal)}
.edict .name{font-size:28px;font-weight:700;border-bottom:2px solid var(--cord);display:inline-block;min-width:6em;padding:0 .4em}
.edict .royal{align-self:flex-end;width:78px;height:78px;border:4px solid var(--seal);color:var(--seal);border-radius:8px;display:grid;place-items:center;font-size:20px;line-height:1.1;font-weight:700;transform:rotate(6deg);white-space:pre-line}
/* num: type the answer (math) */
.numrow{display:flex;align-items:center;gap:10px}
input.numin{width:9em;font-family:var(--f-ui);font-size:26px;text-align:center;font-variant-numeric:tabular-nums;letter-spacing:.04em;padding:8px 10px;background:var(--surface)}
input.numin.wide{width:100%;max-width:520px;text-align:left;font-size:24px}
input.numin.sm{width:5.4em;font-size:19px;padding:2px 6px;margin:0 3px;border-radius:8px;display:inline-block;vertical-align:baseline}
input.numin.right{border-color:var(--ok);background:var(--ok-soft)}
input.numin.wrong{border-color:var(--bad);background:var(--bad-soft)}
.numtext{line-height:2.6;white-space:pre-line}
.unit{font-size:20px}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%;max-width:300px}
.keypad button{font-family:var(--f-round);font-size:24px;font-weight:600;min-height:52px;border-radius:16px;border:2px solid var(--line);background:var(--surface);font-variant-numeric:tabular-nums}
.keypad button:active{background:var(--jade-soft);border-color:var(--jade)}
.stack{display:inline-grid;gap:0 3px;font-family:var(--f-ui);font-size:24px;font-variant-numeric:tabular-nums;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 20px;justify-items:center;line-height:1.4;margin-top:6px}
.stack .op{color:var(--seal);font-weight:700;padding-right:8px}
.stack i{font-style:normal;color:var(--muted);opacity:.6}
.stack .pt{color:var(--seal);font-weight:700}
.stack .rule{border-top:2px solid var(--ink);height:0;justify-self:stretch;margin-top:4px}
/* listen: the browser reads st.say aloud (English lessons) */
.listen{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.speak{display:inline-flex;align-items:center;gap:8px;background:var(--jade);color:var(--surface);border:2px solid var(--jade);border-radius:999px;padding:8px 20px;font-size:18px;font-weight:700;min-height:48px}
.speak.slow{background:none;color:var(--jade)}
.speak svg{width:22px;height:22px;flex:none}
.speak.playing{animation:pulse 1s ease-in-out infinite}
.locked .speak{pointer-events:auto}
.said{display:block;margin:6px 0;font-weight:600}
.nospeech{margin:0;font-family:var(--f-ui);font-size:14px;color:var(--muted)}
/* buddies */
.buddy{display:block;flex:none;overflow:visible}
.item .bud{flex:none;width:52px;height:52px}
.say{display:flex;gap:12px;align-items:flex-end}
.bubble{margin:0;flex:1;min-width:0;background:var(--bg);border:2px solid var(--line);border-radius:22px 22px 22px 6px;padding:10px 14px;font-size:16px;line-height:1.6}
.bubble b{display:block;font-size:14px;color:var(--muted);font-weight:600}
.fbrow{display:flex;gap:12px;align-items:flex-start}
.fbrow>div{flex:1;min-width:0}
.fb.ok .buddy{animation:hop .5s ease-out}
@keyframes hop{30%{transform:translateY(-10px)}60%{transform:translateY(0)}80%{transform:translateY(-3px)}}
.done-art{display:flex;gap:18px;align-items:center;justify-content:center}
.gate-buddies{display:flex;justify-content:center;gap:2px;flex-wrap:wrap}
.cert-buddy{display:flex;justify-content:center}
@media (max-width:440px){.match{gap:8px}.tile{font-size:18px;padding:8px}.q{font-size:19px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

</head>
<body>
<div class="page">
  <header class="top" id="hud"></header>
  <section class="stage" id="stage" aria-label="3D 地圖">
    <div class="pins" id="pins"></div>
    <span class="hint">拖曳轉動・滾輪或雙指縮放・點地標前進</span>
    <div class="stage-ctl"><button id="up-btn" hidden>回上一層</button><button id="recenter">回到全景</button></div>
    <div class="toast" id="toast" hidden></div>
  </section>
  <div id="below" class="page" style="gap:14px"></div>
</div>
<div id="sheet" hidden><div class="wrap" id="app"></div></div>
<div id="gate">
  <form class="pass" id="gate-form" autocomplete="off">
    <div class="gate-buddies" id="gate-buddies" aria-hidden="true"></div>
    <div class="eyebrow">冒險者通行證</div>
    <h1>學習小夥伴</h1>
    <p>輸入你的冒險者名稱。下次用同一個名稱，在任何裝置都能接著玩。</p>
    <label for="acct-name" class="note">冒險者名稱（1～20 字，不需要密碼）</label>
    <input type="text" id="acct-name" maxlength="20" placeholder="例如：小明">
    <div class="recent" id="recent"></div>
    <div class="err" id="gate-err" aria-live="polite"></div>
    <button class="btn red" id="gate-go" type="submit">出發！</button>
    <div class="status" id="gate-status"><span class="dot"></span><span>正在連線雲端⋯⋯</span></div>
  </form>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
'use strict';
/* ================= utilities ================= */
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pick=a=>a[Math.floor(Math.random()*a.length)];
function shuffle(a){const b=a.slice();for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
function shuffleDiff(a){if(a.length<2)return a.slice();let b;do{b=shuffle(a)}while(b.every((x,i)=>x===a[i]));return b}
const ZH='零一二三四五六七八九';
function zhNum(n){if(n<10)return ZH[n];if(n<20)return '十'+(n%10?ZH[n%10]:'');return ZH[Math.floor(n/10)]+'十'+(n%10?ZH[n%10]:'');}
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
const OK=['答對了！','好眼力！','太厲害了！','完全正確！','真聰明！'];
const NO=['再想想看','差一點點','回課文找找線索'];
const NO_MATH=['再算一次看看','差一點點','再想想看'];

/* ================= buddies: one original mascot per island ================= */
const EYE=(x,y,h)=>h?`<path d="M${x-7} ${y+2} Q${x} ${y-8} ${x+7} ${y+2}" stroke="#2E2B4D" stroke-width="4.5" fill="none" stroke-linecap="round"/>`
  :`<ellipse cx="${x}" cy="${y}" rx="6.5" ry="8" fill="#2E2B4D"/><circle cx="${x+2.3}" cy="${y-3.3}" r="2.4" fill="#fff"/>`;
const BUDDIES={
  momo:{name:'墨墨',eyes:[[82,134],[118,134]],
    art:'<path d="M30 40C34 48 38 52 38 57C38 61 35 64 31 64C27 64 24 61 24 57C24 52 28 48 30 40Z" fill="#B9C1F0"/><path d="M100 18C118 52 160 86 160 128C160 162 133 186 100 186C67 186 40 162 40 128C40 86 82 52 100 18Z" fill="#8F9BE6"/><ellipse cx="70" cy="108" rx="9" ry="18" fill="#fff" opacity=".45" transform="rotate(22 70 108)"/><ellipse cx="80" cy="186" rx="13" ry="6" fill="#737FD0"/><ellipse cx="120" cy="186" rx="13" ry="6" fill="#737FD0"/><ellipse cx="66" cy="152" rx="9" ry="5" fill="#F5A3B5" opacity=".85"/><ellipse cx="134" cy="152" rx="9" ry="5" fill="#F5A3B5" opacity=".85"/><path d="M93 150Q100 157 107 150" stroke="#2E2B4D" stroke-width="3" fill="none" stroke-linecap="round"/><line x1="154" y1="160" x2="180" y2="104" stroke="#E9C77B" stroke-width="7" stroke-linecap="round"/><path d="M148 158Q142 174 152 180Q161 173 159 160Z" fill="#3A3760"/><ellipse cx="155" cy="154" rx="9" ry="8" fill="#8F9BE6"/>',
    ok:['這個字我收下囉！','好眼力，線索被你找到了！','又多一個好語詞！'],no:['再讀一次那一段，線索就藏在裡面。','慢慢來，回課文找找看。'],
    grow:n=>n?`毛筆收集了 ${n} 種墨色`:'讀完一課，毛筆就會換上新墨色'},
  chichi:{name:'齒齒',eyes:[[84,114],[116,114]],
    art:'<line x1="100" y1="60" x2="100" y2="30" stroke="#B88A1C" stroke-width="5" stroke-linecap="round"/><circle cx="100" cy="25" r="8" fill="#FF8FA3"/><g fill="#F2BE48">'+[0,40,80,120,160,200,240,280,320].map(a=>`<rect x="89" y="48" width="22" height="24" rx="7" transform="rotate(${a} 100 118)"/>`).join('')+'</g><circle cx="100" cy="118" r="58" fill="#FFD86E"/><rect x="60" y="88" width="80" height="60" rx="22" fill="#FFF7DC"/><ellipse cx="72" cy="130" rx="7" ry="4.5" fill="#FFB0B8"/><ellipse cx="128" cy="130" rx="7" ry="4.5" fill="#FFB0B8"/><path d="M92 130Q100 138 108 130" stroke="#3D3A4F" stroke-width="3" fill="none" stroke-linecap="round"/><circle cx="62" cy="158" r="5" fill="#FF8FA3"/><circle cx="138" cy="158" r="5" fill="#8FC9E8"/><ellipse cx="80" cy="180" rx="14" ry="7" fill="#E5AE3A"/><ellipse cx="120" cy="180" rx="14" ry="7" fill="#E5AE3A"/>',
    ok:['喀啦喀啦，剛剛好！','算對了，天線亮起來了！','齒輪轉得好順！'],no:['齒輪卡住了，我們再算一次。','別急，一步一步算。'],
    grow:n=>n?`身上有 ${n} 顆彩色螺絲`:'過完一課，就能拿到第一顆彩色螺絲'},
  langlang:{name:'浪浪',eyes:[[84,110],[116,110]],
    art:'<path d="M146 112Q176 88 174 66Q150 80 138 104Z" fill="#BFE7DB" stroke="#9FCFE0" stroke-width="3" stroke-linejoin="round"/><ellipse cx="100" cy="122" rx="58" ry="54" fill="#fff" stroke="#9FCFE0" stroke-width="4"/><path d="M94 70Q99 54 110 64" stroke="#9FCFE0" stroke-width="4" fill="none" stroke-linecap="round"/><path d="M50 118Q28 140 50 162Q66 152 64 128Z" fill="#BFE7DB" stroke="#9FCFE0" stroke-width="3" stroke-linejoin="round"/><path d="M72 78Q102 146 150 150" stroke="#6FA8CF" stroke-width="6" fill="none" stroke-linecap="round"/><ellipse cx="70" cy="128" rx="8" ry="4.5" fill="#FFB8C2"/><ellipse cx="130" cy="128" rx="8" ry="4.5" fill="#FFB8C2"/><path d="M91 122L109 122L100 135Z" fill="#FFB16B" stroke="#F09A4E" stroke-width="2" stroke-linejoin="round"/><rect x="128" y="140" width="36" height="30" rx="8" fill="#7FB6DA"/><path d="M134 160L142 155L150 161L158 156" stroke="#fff" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M86 174L80 186H94Z" fill="#FFB16B"/><path d="M114 174L108 186H122Z" fill="#FFB16B"/>',
    ok:['地圖上又多了一個地方！','答對了，飛高高！','記下來了，地圖又更完整了！'],no:['先找找北邊在哪裡吧。','再看一次課本的重點。'],
    grow:n=>n?`地圖袋有 ${n} 枚島嶼貼紙`:'過完一課，地圖袋就多一枚貼紙'},
  diandian:{name:'點點',eyes:[[86,130],[114,130]],wait:'還在森林裡，等自然島開放',
    art:'<path d="M88 70Q78 44 62 40" stroke="#5B4651" stroke-width="4" fill="none" stroke-linecap="round"/><path d="M112 70Q122 44 138 40" stroke="#5B4651" stroke-width="4" fill="none" stroke-linecap="round"/><circle cx="60" cy="39" r="7" fill="#5B4651"/><circle cx="140" cy="39" r="7" fill="#5B4651"/><circle cx="100" cy="126" r="60" fill="#FF9F8F"/><path d="M100 66V100" stroke="#E7806F" stroke-width="3" stroke-linecap="round"/><circle cx="58" cy="104" r="9" fill="#6B4E58"/><circle cx="142" cy="104" r="9" fill="#6B4E58"/><circle cx="52" cy="146" r="7" fill="#6B4E58"/><circle cx="148" cy="146" r="7" fill="#6B4E58"/><circle cx="100" cy="80" r="7" fill="#6B4E58"/><ellipse cx="100" cy="134" rx="36" ry="29" fill="#FFF1E6"/><ellipse cx="76" cy="146" rx="6" ry="4" fill="#FFB3B0"/><ellipse cx="124" cy="146" rx="6" ry="4" fill="#FFB3B0"/><path d="M94 146Q100 152 106 146" stroke="#3D3A4F" stroke-width="3" fill="none" stroke-linecap="round"/><line x1="168" y1="176" x2="184" y2="194" stroke="#8C7466" stroke-width="7" stroke-linecap="round"/><circle cx="158" cy="164" r="17" fill="#DDF1F7" stroke="#8C7466" stroke-width="6"/><ellipse cx="146" cy="176" rx="9" ry="8" fill="#FF9F8F"/><ellipse cx="80" cy="186" rx="12" ry="6" fill="#E9877A"/><ellipse cx="120" cy="186" rx="12" ry="6" fill="#E9877A"/>',
    ok:['又多一個點了！','觀察得真仔細！'],no:['再靠近一點看看？','慢慢觀察，答案會出現。'],
    grow:n=>n?`背上有 ${n} 個點`:'過完一課，背上就多一個點'},
  qiuqiu:{name:'球球',eyes:[[86,100],[114,100]],
    art:'<path d="M70 146L84 170M130 146L116 170M100 152V170" stroke="#A06C36" stroke-width="3" stroke-linecap="round"/><ellipse cx="100" cy="86" rx="64" ry="68" fill="#FF9E7A"/><ellipse cx="100" cy="86" rx="40" ry="68" fill="#FFD36E"/><ellipse cx="100" cy="86" rx="15" ry="68" fill="#7CC8E8"/><path d="M68 144L132 144L120 158L80 158Z" fill="#E57C5C"/><ellipse cx="66" cy="54" rx="8" ry="17" fill="#fff" opacity=".45" transform="rotate(-24 66 54)"/><ellipse cx="100" cy="108" rx="34" ry="27" fill="#FFF4E2"/><ellipse cx="74" cy="116" rx="7" ry="4.5" fill="#F5A3B5"/><ellipse cx="126" cy="116" rx="7" ry="4.5" fill="#F5A3B5"/><path d="M92 116Q100 124 108 116" stroke="#2E2B4D" stroke-width="3" fill="none" stroke-linecap="round"/><rect x="78" y="166" width="44" height="24" rx="6" fill="#C08A4E"/><rect x="78" y="171" width="44" height="4" fill="#A06C36"/><circle cx="146" cy="44" r="12" fill="#fff"/><path d="M146 35l2.6 5.8 6.3.6-4.8 4.2 1.4 6.2-5.5-3.3-5.5 3.3 1.4-6.2-4.8-4.2 6.3-.6z" fill="#E5AE3A"/>',
    ok:['Good job! 又飛高一點了！','Awesome! 答對了！','Great! 氣球又多一張貼紙！'],no:['再聽一次看看，慢慢來。','Take your time，再讀一次。'],
    grow:n=>n?`氣球上貼了 ${n} 張國家貼紙`:'過完一課，氣球就會貼上第一張國家貼紙'}
};
Object.keys(BUDDIES).forEach(k=>BUDDIES[k].id=k);
const BUDDY_OF={zh:'momo',math:'chichi',soc:'langlang',sci:'diandian',en:'qiuqiu'};
function buddySvg(id,size,happy){const B=BUDDIES[id];if(!B)return '';
  return `<svg class="buddy" width="${size}" height="${size}" viewBox="0 0 200 200" role="img" aria-label="${B.name}">${B.art}${B.eyes.map(([x,y])=>EYE(x,y,happy)).join('')}</svg>`;}
function buddyOf(subjectId){const s=CAT&&CAT.subjects.find(x=>x.id===subjectId);return BUDDIES[(s&&s.buddy)||BUDDY_OF[subjectId]]||null;}
const LS={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const gradeOrder=g=>(parseInt(g,10)||0)*2+(/下/.test(g)?1:0);
let toastT;function toast(msg){const t=$('toast');t.textContent=msg;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,2600);}

/* ================= content ================= */
let CAT=null; const LESSONS={};
async function loadJSON(u){const r=await fetch(u,{cache:'no-cache'});if(!r.ok)throw new Error(u+' '+r.status);return r.json();}
async function getLesson(entry){if(!LESSONS[entry.id])LESSONS[entry.id]=await loadJSON(entry.file);return LESSONS[entry.id];}
const lessonTotal=l=>l.levels.reduce((n,lv)=>n+lv.steps.length,0);
const findSubject=id=>CAT.subjects.find(s=>s.id===id);
const findEntry=id=>{for(const s of CAT.subjects)for(const e of s.lessons)if(e.id===id)return {s,e};return null;};

/* ================= accounts + progress ================= */
const Store={mode:'pending',db:null,pid:null,name:'',key:'',progress:{},timers:{},chains:{}};
const normName=s=>s.normalize('NFKC').trim().replace(/\s+/g,' ');
const nameKey=s=>'h-'+[...new TextEncoder().encode(normName(s).toLowerCase())].map(b=>b.toString(16).padStart(2,'0')).join('');
function newId(){try{return 'p-'+crypto.randomUUID();}catch(e){return 'p-'+Date.now().toString(36)+Math.random().toString(36).slice(2,12);}}
function lp(lid){return Store.progress[lid]||(Store.progress[lid]={stars:{},done:{},answers:{}});}
const lessonStars=lid=>Object.values(lp(lid).stars).reduce((a,b)=>a+b,0);
const totalStars=()=>Object.keys(Store.progress).reduce((n,k)=>n+lessonStars(k),0);

async function connectDb(){
  if(window.LEARNLAND_DB)return window.LEARNLAND_DB;
  if(!window.claude||!window.claude.use)return null;
  try{return await Promise.race([window.claude.use('db'),new Promise(r=>setTimeout(()=>r(null),6000))]);}catch(e){return null;}
}
async function claimAccount(key,name){
  const ref=Store.db.doc('accounts/'+key);
  let s=await ref.get();
  if(s.exists&&s.data().pid)return s.data().pid;
  for(let i=0;i<4;i++){
    const lease=await ref.acquire({holder:newId(),ttlMs:5000});
    s=await ref.get();
    if(s.exists&&s.data().pid)return s.data().pid;
    if(lease.acquired){
      const pid=newId(),now=Date.now();
      await ref.set({name,pid,createdAt:now});
      await Store.db.doc('players/'+pid).set({name,createdAt:now});
      return pid;
    }
    await new Promise(r=>setTimeout(r,1200));
  }
  throw {code:'busy'};
}
async function login(raw){
  const name=normName(raw),key=nameKey(raw);
  Store.name=name;Store.key=key;Store.progress={};Store.cloudNote=false;Store.sync=null;
  if(Store.db){
    try{
      Store.pid=await claimAccount(key,name);
      const snap=await Store.db.collection('players/'+Store.pid+'/lessons').get();
      snap.docs.forEach(d=>{const x=d.data()||{};Store.progress[d.id]={stars:{...(x.stars||{})},done:{...(x.done||{})},answers:{...(x.answers||{})},secs:{...(x.secs||{})},rush:{...(x.rush||{})},retry:{...(x.retry||{})}};if(x.quiz)Store.progress[d.id].quiz=x.quiz;if(x.medal)Store.progress[d.id].medal=x.medal;});
      Store.mode='cloud';
    }catch(e){console.warn('cloud login failed',e);Store.mode='local';Store.cloudNote=true;}
  }else Store.mode='local';
  if(Store.mode==='local'){Store.pid=null;Store.progress=LS.get('ll-progress-'+key)||{};}
  const rec=(LS.get('ll-recent')||[]).filter(n=>nameKey(n)!==key);rec.unshift(name);LS.set('ll-recent',rec.slice(0,5));
}
function setSync(st){Store.sync=st;const el=$('sync');if(!el)return;
  const txt={ok:'已存到雲端',saving:'儲存中⋯⋯',err:'雲端儲存失敗，先存在這台裝置',local:'進度存在這台裝置'}[st]||'';
  el.innerHTML=`<span class="dot ${st}"></span>${txt}`;}
function save(lid){
  LS.set(Store.mode==='cloud'?'ll-backup-'+Store.key:'ll-progress-'+Store.key,Store.progress);
  if(Store.mode!=='cloud'){setSync('local');return;}
  setSync('saving');clearTimeout(Store.timers[lid]);Store.timers[lid]=setTimeout(()=>flush(lid),700);
}
function flush(lid){
  clearTimeout(Store.timers[lid]);delete Store.timers[lid];
  const body=JSON.parse(JSON.stringify(lp(lid)));body.updatedAt=Date.now();
  const prev=Store.chains[lid]||Promise.resolve();
  Store.chains[lid]=prev.then(()=>Store.db.doc('players/'+Store.pid+'/lessons/'+lid).set(body))
    .then(()=>{if(!Object.keys(Store.timers).length)setSync('ok');})
    .catch(e=>{console.warn('save failed',e);setSync('err');});
}
addEventListener('pagehide',()=>Object.keys(Store.timers).forEach(flush));

/* ================= navigation state ================= */
const NAV={view:'world',subject:null,entry:null,lesson:null};
function hud(){
  let title='學習<em>小夥伴</em>',crumbs=`<span>選一座島，找你的小夥伴</span>`;
  if(NAV.view!=='world'){
    const s=NAV.subject;crumbs=`<button data-go="world">小夥伴大陸</button><span class="sep">›</span>`;
    if(NAV.view==='subject'){title=`${esc(s.name)}<em>${esc(s.region)}</em>`;crumbs+=`<span>${esc(s.name)}${esc(s.region)}</span>`;}
    else{const e=NAV.entry;title=`${esc(e.place||e.title)}<em>闖關</em>`;
      crumbs+=`<button data-go="subject">${esc(s.name)}${esc(s.region)}</button><span class="sep">›</span><span>${esc(e.grade)} 第${zhNum(e.no)}課 ${esc(e.title)}</span>`;}
  }
  const lessonChip=NAV.view==='lesson'&&NAV.lesson?`<span class="chip"><span class="star">★</span> 本課 ${lessonStars(NAV.lesson.id)} / ${lessonTotal(NAV.lesson)}</span>`:'';
  $('hud').innerHTML=`<div><nav class="crumbs" aria-label="位置">${crumbs}</nav><h1>${title}</h1></div>
    <div class="chips"><span class="chip"><button class="me-btn" data-me title="我的獎章">冒險者 <b>${esc(Store.name)}</b><span class="me-count">${medalSvg({tier:0,seal:''},13)}${medalCount()}</span></button> <button id="switch">換人</button></span>
    <span class="chip"><span class="star">★</span> ${totalStars()}</span>${lessonChip}<span class="chip" id="sync"></span></div>`;
  $('hud').querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>b.dataset.go==='world'?goWorld():goSubject(NAV.subject.id));
  $('switch').onclick=()=>{Object.keys(Store.timers).forEach(flush);showGate();};
  setSync(Store.mode==='cloud'?(Store.sync==='err'?'err':'ok'):'local');
  $('up-btn').hidden=NAV.view==='world';
}

const lessonCleared=id=>{const L=LESSONS[id];return !!L&&nextLevel(L)<0;};
const subjectCleared=s=>s.lessons.filter(e=>lessonCleared(e.id)).length;
function goWorld(){
  NAV.view='world';NAV.subject=null;NAV.entry=null;NAV.lesson=null;closeSheet(false);hud();
  const render=()=>{$('below').innerHTML=`<p class="intro">歡迎來到小夥伴大陸！每座島住著一位小夥伴，點島嶼進去，就能看到每一課的關卡。${Store.mode==='local'&&Store.cloudNote?'（目前連不上雲端，進度先存在這台裝置。）':''}</p>
    <div class="list">${CAT.subjects.map(s=>{const n=s.lessons.length;const st=s.lessons.reduce((a,e)=>a+lessonStars(e.id),0);const B=buddyOf(s.id),c=subjectCleared(s);

   time are recorded only on the very first attempt ever, so replays cannot earn stars back.

  // a buddy that hops in place and moves to wherever posFn says on every refresh

    const r0=v.refresh,u0=v.update;v.refresh=()=>{if(r0)r0();put();};v.update=(dt,now)=>{if(u0)u0(dt,now);if(!reduced)b.position.y=Math.abs(Math.sin(now/380))*.45*scale/1.4;};put();return v;}

  /* ================= WORLD VIEW ================= */

      [[-9,-8],[9,-8],[-9,8],[9,8]].forEach(([x,z])=>{g.add(box(2.4,1.6,2.2,C.plaster,x,y+.8,z));g.add(pyr(3,2.8,1.2,C.tile,y+1.6));g.children[g.children.length-1].position.set(x,y+1.6+.6,z);});

  function buildWorld(cat){

    for(let i=0;i<n&&n>1;i++){const a=pos[i],b=pos[(i+1)%n];if(n===2&&i===1)break;const dx=b[0]-a[0],dz=b[1]-a[1],L=Math.hypot(dx,dz);
      const br=box(L-26,.6,3,C.wood,(a[0]+b[0])/2,2.4,(a[1]+b[1])/2);br.rotation.y=-Math.atan2(dz,dx);group.add(br);}

  /* ================= SUBJECT VIEW ================= */
  function landmark(theme,ch,ok=true){
    const g=new T.Group();
    if(!ok){[[0,-3,7,.2],[0,3,7,.2],[-3.5,0,.2,6],[3.5,0,.2,6]].forEach(([x,z,w,d])=>g.add(box(w,.9,d,C.wood,x,.45,z)));
      g.add(flat(6.6,5.6,C.earth,0,0,.06));const b=banner('？','#8a8f88','#f7efd9',3.4);b.position.set(-1,0,0);g.add(b);g.userData.top=3.6;return g;}
    if(theme==='forest'){g.add(cyl(.9,1.2,6,C.trunk,0,3,0,8));g.add(cone(4.5,6,C.leaf,0,8,0,8));g.add(box(5,.4,5,C.wood,0,5,0));g.add(box(2.6,2,2.6,C.plaster,0,6.2,0));}
    else if(theme==='blocks'){for(let j=0;j<4;j++)g.add(box(4-j*.6,2,4-j*.6,[C.c3,C.c2,C.c1,C.slate][j],0,1+j*2,0));}
    else if(theme==='harbor'){g.add(cyl(3.2,3.6,1,C.stone,0,.5,0,10));const lh=lighthouseTower(.62);lh.position.y=1;g.add(lh);}
    else if(theme==='world'){g.add(cyl(2.6,3,1.2,C.stone,0,.6,0,12));g.add(cyl(.35,.45,2.4,C.steel,0,2.4,0,8));const gl=globeBall(2.3);gl.position.y=5.6;g.add(gl);}
    else{g.add(box(8,1,8,C.stone,0,.5,0));[[-3,-3],[3,-3],[-3,3],[3,3]].forEach(([x,z])=>g.add(cyl(.28,.28,3.6,C.red,x,2.8,z,8)));
      g.add(box(9,.3,9,C.tile,0,4.75,0));g.add(pyr(9,9,2,C.tile,4.9));g.add(pyr(5,5,1.6,C.tile,6.6));}
    const b=banner(ch,'#b5321d','#f7efd9',5.5);b.position.set(4.6,0,3.2);g.add(b);
    g.userData.top=theme==='forest'?11:theme==='blocks'?8:theme==='harbor'?10.4:theme==='world'?8.6:8.2;return g;
  }
  function buildSubject(s,entries){
    const group=new T.Group(),theme=s.theme;
    const groundC=theme==='forest'?C.forestGround:theme==='blocks'?C.blockGround:theme==='harbor'?C.harborGround:theme==='world'?C.worldGround:C.grass;
    group.add(flat(600,600,groundC,0,0,0));
    if(theme==='harbor'){group.add(flat(14,600,C.sand,43,0,.03));group.add(flat(300,600,C.sea,200,0,.04));}
    const slots=entries.length+2,span=Math.max(60,slots*16);
    const pts=[];for(let k=0;k<slots;k++){const t=slots<2?0:k/(slots-1);pts.push(new T.Vector3(Math.sin(k*1.3)*18,0,span/2-t*span));}
    const curve=new T.CatmullRomCurve3([pts[0].clone().add(new T.Vector3(0,0,14)),...pts,pts[pts.length-1].clone().add(new T.Vector3(0,0,-14))]);
    const samples=curve.getSpacedPoints(slots*22);
    const stones=new T.InstancedMesh(new T.CylinderGeometry(1.5,1.5,.18,10),M(C.road),samples.length);const dm=new T.Object3D();
    samples.forEach((p,i)=>{dm.position.set(p.x,.09,p.z);dm.updateMatrix();stones.setMatrixAt(i,dm.matrix);});stones.receiveShadow=true;group.add(stones);
    const r=rng(3+slots),tp=[];const near=(x,z)=>samples.some(p=>Math.hypot(p.x-x,p.z-z)<6)||pts.some(p=>Math.hypot(p.x-x,p.z-z)<10);
    for(let i=0;i<600&&tp.length<70;i++){const x=(r()*2-1)*70,z=(r()*2-1)*(span/2+30);if(!near(x,z)&&!(theme==='harbor'&&x>34))tp.push([x,z,.8+r()*.7]);}
    if(theme==='blocks'){tp.forEach(([x,z,s2],i)=>{if(i%2)group.add(box(2*s2,2*s2,2*s2,[C.c3,C.c2,C.c1,C.slate][i%4],x,s2,z));});}
    else trees(group,tp,theme==='forest'?C.leaf:C.leaf2);
    const places=[];
    for(let k=0;k<slots;k++){const e=entries[k],ok=!!e;const g=landmark(theme,ok?zhNum(e.no):'？',ok);
      g.position.set(pts[k].x+(k%2?6:-6),0,pts[k].z);g.rotation.y=k%2?-.35:.35;group.add(g);
      const p=mark(g,k,ok?()=>{const L=LESSONS[e.id],done=L&&nextLevel(L)<0,first=entries.findIndex(x=>{const l=LESSONS[x.id];return !l||nextLevel(l)>=0;});
        return {seal:zhNum(e.no),name:`第${zhNum(e.no)}課 ${e.title}`,sub:`${e.grade}${L?`・★${lessonStars(e.id)}/${lessonTotal(L)}`:''}`,cls:done?'done':(k===first?'next':'')};}
        :()=>({seal:'？',name:'即將開放',sub:'下一課',cls:'locked'}),ok?()=>enterLesson(e.id):()=>toast('這一課還在準備中，敬請期待！'));
      p.id=ok?e.id:null;places.push(p);}
    const v={group,places,visitD:34,home:{x:0,z:0,d:Math.max(90,span*1.15),az:.55,pol:.9,min:30,max:Math.max(200,span*2.4)}};
    const bd=buddyOf(s.id);
    return withBuddy(v,bd&&bd.id,()=>{let k=entries.findIndex(x=>{const l=LESSONS[x.id];return !l||nextLevel(l)>=0;});if(k<0)k=Math.max(entries.length-1,0);return {x:pts[k].x,z:pts[k].z+6,ry:.4};},1.5);
  }

  /* ================= LESSON VIEW ================= */
  // One building per level from the template's kit; a seal flag appears on top once the level is passed.
  function levelPlaces(group,L,used,spotOf,kit,fallback){
    return used.map((lv,i)=>{const spec=typeof lv.building==='string'?{type:lv.building}:(lv.building||{});
      const g=(kit[spec.type]||kit[fallback])(spec);const [x,z]=spotOf(i);g.position.set(x,0,z);
      const flag=banner(lv.seal,'#b5321d','#f7efd9',3.2);flag.position.set(0,g.userData.top-.6,0);flag.visible=false;g.add(flag);g.userData.flag=flag;group.add(g);
      const p=mark(g,i,()=>{const P=lp(L.id),done=!!P.done[lv.id];return {seal:lv.seal,name:lv.place,sub:'',cls:done?'done':(i===nextLevel(L)?'next':'')};},()=>enterLevel(i));
      p.idx=i;return p;});
  }
  const showFlags=(L,places,used)=>{const P=lp(L.id);places.forEach((p,i)=>p.obj.userData.flag.visible=!!P.done[used[i].id]);};
  const waveFlags=(places,now)=>places.forEach(p=>{const f=p.obj.userData.flag;if(f.visible)f.userData.cloth.rotation.y=Math.sin(now/500+p.obj.position.x)*.25;});
  const TEMPLATES={'ancient-city':buildAncientCity,'gear-city':buildGearCity,'harbor-town':buildHarborTown,'forest-camp':buildForestCamp,'world-trip':buildWorldTrip};
  function buildLesson(L){const v=(TEMPLATES[L.scene&&L.scene.template]||buildAncientCity)(L),bd=buddyOf(L.subject);
    return withBuddy(v,bd&&bd.id,()=>{const n=nextLevel(L),at=L.reward?L.levels.findIndex(x=>x.id===L.reward.at):-1;
      const p=v.places[n>=0?n:(at>=0?at:v.places.length-1)];if(!p)return null;const o=p.obj.position,dx=-o.x,dz=4-o.z,len=Math.hypot(dx,dz)||1;
      return {x:o.x+dx/len*9,z:o.z+dz/len*9};},1.4);}

  /* ---- ancient-city (古城) ---- */
  function buildAncientCity(L){
    const group=new T.Group(),HALF=40;
    group.add(flat(600,600,C.grass,0,0,0));group.add(flat(HALF*2,HALF*2,C.earth,0,0,.02));

  function buildForestCamp(L){

    group.add(cyl(2.2,2.6,1.2,C.stone,0,.6,-9,14),cyl(.25,.25,2.6,C.steel,0,2.4,-9,8));
    const sunG=new T.Group();sunG.position.set(0,5,-9);sunG.add(ball(1.6,C.sunY,0,0,0));
    for(let i=0;i<10;i++){const a=i/10*Math.PI*2,r=cone(.35,1,C.orange,Math.cos(a)*2.2,Math.sin(a)*2.2,0,6);r.rotation.z=a-Math.PI/2;sunG.add(r);}
    [-1,1].forEach(k=>{sunG.add(ball(.16,C.dark,k*.5,.3,1.5));const ch=ball(.22,C.flower,k*.95,-.25,1.25);ch.scale.set(1.3,.7,.5);sunG.add(ch);});
    const sm=new T.Mesh(new T.TorusGeometry(.45,.07,6,14,Math.PI),M(C.dark));sm.rotation.z=Math.PI;sm.position.set(0,-.25,1.55);sunG.add(sm);
    group.add(sunG);
    // a winding stream along the west edge
    const sp=[];for(let z=-90;z<=90;z+=1.5)sp.push([-47+Math.sin(z/14)*4,z]);
    const wg=new T.CircleGeometry(2.6,12);wg.rotateX(-Math.PI/2);const water=new T.InstancedMesh(wg,M(C.water),sp.length);const dm=new T.Object3D();
    sp.forEach(([x,z],i)=>{dm.position.set(x,.04,z);dm.updateMatrix();water.setMatrixAt(i,dm.matrix);});water.receiveShadow=true;group.add(water);
    const n=L.levels.length,used=L.levels.slice(0,16);
    const S=[[0,HALF],[-15,17],[15,17],[-17,-6],[17,-6],[-31,-14],[32,-12],[-28,-31],[26,-24],[-14,-34],[14,-34],[-27,29],[27,28],[-33,10],[33,10]],FIN=[0,-25];
    const spotOf=i=>i===used.length-1&&i>0?FIN:S[i];
    const busy=[[0,8,8,99],[0,4,70,6],[0,-9,16,16],...used.map((_,i)=>[spotOf(i)[0],spotOf(i)[1],15,13])];
    const free=(x,z)=>!busy.some(([bx,bz,w,d])=>Math.abs(x-bx)<w/2&&Math.abs(z-bz)<d/2)&&!sp.some(([sx,sz])=>Math.abs(sx-x)<4&&Math.abs(sz-z)<2);
    const r=rng(17),tp=[],fl=[];
    for(let i=0;i<700&&tp.length<30;i++){const a=r()*Math.PI*2,d=Math.sqrt(r())*50,x=Math.cos(a)*d,z=Math.sin(a)*d;if(free(x,z)){tp.push([x,z,.6+r()*.5]);busy.push([x,z,3,3]);}}

    for(let i=0;i<110;i++){const a=r()*Math.PI*2,d=57+r()*50,x=Math.cos(a)*d,z=Math.sin(a)*d;if(sp.some(([sx,sz])=>Math.abs(sx-x)<4&&Math.abs(sz-z)<2))continue;tp.push([x,z,1.3+r()*.9]);}

    const fm=new T.InstancedMesh(new T.SphereGeometry(.3,8,6),new T.MeshLambertMaterial({color:0xffffff}),fl.length),fc=[C.flower,C.yellow,C.white,0xb39ddb].map(c=>new T.Color(c));

      b.add(box(.12,.12,.8,C.dark,0,0,0));group.add(b);return {b,ws,cx,cz,ph:i*1.7};});

    const r=rng(23),tp=[];let homes=0,palms=0;
    for(let i=0;i<900&&(homes<12||palms<10);i++){const a=r()*Math.PI*2,d=Math.sqrt(r())*50,x=Math.cos(a)*d,z=Math.sin(a)*d;if(!free(x,z))continue;
      if(homes<12&&i%2){const h=new T.Group();const w=2.4+r()*1.4,hh=2+r()*1.6;h.add(box(w,hh,w*.9,C.white,0,hh/2,0));h.add(atXZ(pyr(w+.5,w*.9+.5,1,r()<.75?C.terra:C.blue,hh),0,0));
        h.add(box(.6,1.1,.1,C.wood,0,.55,w*.45+.02));h.position.set(x,0,z);h.rotation.y=r()*Math.PI;group.add(h);homes++;busy.push([x,z,5,5]);}
      else if(palms<10){palm(group,x,z,.65+r()*.3);palms++;busy.push([x,z,3,3]);}}
    for(let i=0;i<70;i++){const a=r()*Math.PI*2,d=57+r()*50,x=Math.cos(a)*d,z=Math.sin(a)*d;if(x>50)continue;tp.push([x,z,1.2+r()*.8]);}
    trees(group,tp,C.leaf2);
    const places=levelPlaces(group,L,used,spotOf,WORLD,'house');
    // a yellow tram running along the street
    const tram=new T.Group();tram.add(box(7,2.2,2.1,C.yellow,0,1.6,0));tram.add(box(7.04,.8,2.14,C.glass,0,2,0));tram.add(box(7.2,.3,2.3,C.white,0,2.85,0));
    tram.add(box(.1,1,.1,C.dark,0,3.5,0));tram.add(box(1.6,.08,.08,C.dark,0,4,0));
    const tw=[];[-2.4,2.4].forEach(x=>[-.95,.95].forEach(z=>{const w=cyl(.4,.4,.16,C.dark,x,.45,z,12);w.rotation.x=Math.PI/2;tram.add(w);tw.push(w);}));
    tram.position.set(-20,0,5);group.add(tram);let dir=1;
    // a fishing boat at sea, two hot-air balloons and a plane overhead
    const boat=fishingBoat(1.3,C.blue);boat.position.set(88,0,-20);boat.rotation.y=Math.PI/2;group.add(boat);
    const balloons=[[airBalloon(C.c1,C.yellow,1.6),-34,26,-30],[airBalloon(C.c2,C.white,1.3),40,30,20]].map(([b,x,y,z])=>{b.position.set(x,y,z);group.add(b);return {b,y};});
    const plane=new T.Group(),pl=new T.Group();pl.position.set(52,34,0);plane.add(pl);
    const body=cyl(.7,.55,7,C.white,0,0,0,12);body.rotation.x=Math.PI/2;pl.add(body);const nose=cone(.7,1.4,C.white,0,0,-4.2,12);nose.rotation.x=-Math.PI/2;pl.add(nose);
    pl.add(box(9,.18,1.8,C.white,0,-.1,.2));pl.add(box(3.2,.15,1,C.white,0,.2,3.2));pl.add(box(.15,1.6,1.2,C.c1,0,.9,3.2));pl.add(box(1.42,.25,6,C.blue,0,.05,0));
    group.add(plane);
    return {group,places,visitD:38,home:{x:0,z:4,d:100,az:.62,pol:.95,min:28,max:170},
      refresh(){showFlags(L,places,used);},
      update(dt,now){SPIN.forEach(f=>f(dt,now));
        tram.position.x+=dir*dt*5;tw.forEach(w=>w.rotation.y+=dt*6*dir);if(tram.position.x>26)dir=-1;if(tram.position.x<-26)dir=1;
        boat.position.z=-20+Math.sin(now/9000)*40;boat.rotation.y=Math.cos(now/9000)>0?-Math.PI/2:Math.PI/2;boat.position.y=Math.sin(now/700)*.15;
        balloons.forEach((o,i)=>{o.b.position.y=o.y+Math.sin(now/1800+i*2)*1.2;o.b.rotation.y+=dt*.1;});
        plane.rotation.y+=dt*.12;waveFlags(places,now);}};
  }

  return {setView,refresh,visitBy,home:goHome,buildWorld,buildSubject,buildLesson};
}

/* ================= gate + boot ================= */
function showGate(){
  $('gate').hidden=false;document.body.style.overflow='hidden';
  const rec=LS.get('ll-recent')||[];
  $('recent').innerHTML=rec.map(n=>`<button type="button" data-n="${esc(n)}">${esc(n)}</button>`).join('');
  $('recent').querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>{$('acct-name').value=b.dataset.n;$('gate-form').requestSubmit();});
  $('acct-name').value=rec[0]||'';$('gate-err').textContent='';
  $('gate-buddies').innerHTML=Object.keys(BUDDIES).map(k=>buddySvg(k,64,false)).join('');
  gateStatus();
}
function gateStatus(){
  const st=$('gate-status');
  if(Store.mode==='pending'){st.innerHTML='<span class="dot saving"></span><span>正在連線雲端⋯⋯</span>';return;}
  st.innerHTML=Store.db?'<span class="dot ok"></span><span>已連上雲端，進度會自動保存，換裝置也能接著玩。</span>'
    :'<span class="dot local"></span><span>目前沒有連上雲端，進度只會存在這台裝置。</span>';
}
$('gate-form').addEventListener('submit',async e=>{
  e.preventDefault();const raw=$('acct-name').value;const name=normName(raw);
  if(!name){$('gate-err').textContent='請先輸入冒險者名稱。';return;}
  if([...name].length>20){$('gate-err').textContent='名稱最多 20 個字。';return;}
  const go=$('gate-go');go.disabled=true;go.textContent='進入中⋯⋯';
  try{await dbReady;await catReady;await login(raw);}catch(err){console.warn(err);}
  if(!CAT){go.disabled=false;go.textContent='出發！';$('gate-err').textContent='讀取課程目錄失敗，請重新整理頁面。';return;}
  go.disabled=false;go.textContent='出發！';
  $('gate').hidden=true;document.body.style.overflow='';
  if(Store.mode==='local'&&Store.cloudNote)toast('雲端暫時無法使用，進度先存在這台裝置。');
  const h=decodeURIComponent(location.hash.slice(1));
  if(h&&findSubject(h)&&findSubject(h).lessons.length)goSubject(h);else if(h&&findEntry(h))goLesson(h);else goWorld();
});

let dbReady,catReady;
(async function boot(){
  try{G=init3D();}catch(e){console.warn(e);G=null;}
  if(!G){const st=$('stage');st.querySelectorAll('.pins,.hint').forEach(x=>x.remove());$('recenter').hidden=true;
    st.insertAdjacentHTML('afterbegin','<div class="nogl">這台裝置無法顯示 3D 地圖，請直接從下面的清單選擇。</div>');}
  showGate();
  dbReady=connectDb().then(db=>{Store.db=db;Store.mode=db?'ready':'local';gateStatus();});
  catReady=loadJSON('content/catalog.json').then(c=>{CAT=c;}).catch(()=>{$('gate-err').textContent='讀取課程目錄失敗，請重新整理頁面。';});
})();
</script>
