<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>學習大陸</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&display=swap">
<style>
/* Layout: header with breadcrumb and player chip; one 3D stage that swaps between world (subjects), subject (lessons) and lesson (levels) views; a plain list mirrors the current view below; levels open in a sheet. */
:root{
  --bg:#e4ece6; --surface:#f7f9f5; --ink:#1c2824; --muted:#56675f; --line:#b7c8bd;
  --jade:#2c6857; --jade-soft:#d0e1d7; --seal:#b5321d; --seal-soft:#f3d6ce;
  --slip:#e8d69e; --slip-ink:#3b2f12; --cord:#8a6d2a;
  --ok:#2b7a4b; --ok-soft:#d5ecdd; --bad:#b5321d; --bad-soft:#f6dcd5; --gold:#c08a1e;
  --sky:#cfe2e3; --light-k:1; --scrim:rgba(228,236,230,.84);
  --f-kai:"LXGW WenKai TC","Kaiti TC","BiauKai","DFKai-SB","STKaiti","Noto Serif TC",serif;
  --f-ui:system-ui,-apple-system,"PingFang TC","Microsoft JhengHei","Noto Sans TC",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1715; --surface:#17211e; --ink:#e3ebe6; --muted:#9db0a7; --line:#2d3d37;
  --jade:#78bda3; --jade-soft:#1f3a31; --seal:#e8694f; --seal-soft:#45231b;
  --slip:#4a3e20; --slip-ink:#f2e4bc; --cord:#b9974d;
  --ok:#6cc690; --ok-soft:#1b3a28; --bad:#ef7d65; --bad-soft:#47241c; --gold:#e2b04a;
  --sky:#16222b; --light-k:.5; --scrim:rgba(15,23,21,.88); color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0f1715; --surface:#17211e; --ink:#e3ebe6; --muted:#9db0a7; --line:#2d3d37;
  --jade:#78bda3; --jade-soft:#1f3a31; --seal:#e8694f; --seal-soft:#45231b;
  --slip:#4a3e20; --slip-ink:#f2e4bc; --cord:#b9974d;
  --ok:#6cc690; --ok-soft:#1b3a28; --bad:#ef7d65; --bad-soft:#47241c; --gold:#e2b04a;
  --sky:#16222b; --light-k:.5; --scrim:rgba(15,23,21,.88); color-scheme:dark;}

body{background:var(--bg);color:var(--ink);font-family:var(--f-kai);font-size:18px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 48px}
.page{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,textarea:focus-visible,input:focus-visible{outline:3px solid var(--jade);outline-offset:2px}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.3}

.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.top h1{font-size:clamp(28px,6.4vw,42px);letter-spacing:.04em}
.top h1 em{font-style:normal;color:var(--seal)}
.crumbs{display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-family:var(--f-ui);font-size:13px;color:var(--muted);letter-spacing:.06em}
.crumbs button{background:none;border:none;padding:0;color:var(--jade);text-decoration:underline;text-underline-offset:3px;font-size:13px}
.crumbs span.sep{opacity:.5}
.chips{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-family:var(--f-ui);font-size:14px;font-variant-numeric:tabular-nums}
.chip button{background:none;border:none;padding:0;color:var(--jade);font-size:13px;text-decoration:underline;text-underline-offset:3px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.ok{background:var(--ok)} .dot.saving{background:var(--gold)} .dot.err,.dot.local{background:var(--seal)}
.star{color:var(--gold)}

.stage{position:relative;height:clamp(380px,62vh,640px);border-radius:18px;overflow:hidden;background:var(--sky);border:1px solid var(--line)}
.stage canvas{display:block;width:100%;height:100%;touch-action:none}
.pins{position:absolute;inset:0;pointer-events:none}
.pin{position:absolute;left:0;top:0;pointer-events:auto;display:flex;align-items:center;gap:6px;padding:3px 10px 3px 3px;border-radius:999px;border:none;
  background:var(--surface);color:var(--ink);box-shadow:0 3px 10px rgba(0,0,0,.18);font-size:15px;white-space:nowrap;will-change:transform;text-align:left;line-height:1.25}
.pin .ps{flex:none;width:26px;height:26px;display:grid;place-items:center;border:2px solid var(--seal);color:var(--seal);border-radius:5px;font-weight:700;font-size:15px}
.pin small{display:block;font-family:var(--f-ui);font-size:11px;color:var(--muted)}
.pin.done .ps{background:var(--seal);color:var(--surface)}
.pin.locked{opacity:.75} .pin.locked .ps{border-color:var(--muted);color:var(--muted)}
.pin.next{animation:pulse 1.6s ease-in-out infinite}
.pin:hover{background:var(--jade-soft)}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--seal) 55%,transparent)}50%{box-shadow:0 0 0 8px color-mix(in srgb,var(--seal) 0%,transparent)}}
.hint{position:absolute;left:12px;bottom:12px;font-family:var(--f-ui);font-size:12px;background:var(--scrim);padding:4px 10px;border-radius:999px;pointer-events:none}
.stage-ctl{position:absolute;right:12px;bottom:10px;display:flex;gap:6px}
.stage-ctl button,.toast{font-family:var(--f-ui);font-size:13px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px 12px}
.toast{position:absolute;left:50%;top:14px;transform:translateX(-50%);pointer-events:none;font-size:15px;box-shadow:0 4px 12px rgba(0,0,0,.15)}
.nogl{display:grid;place-items:center;height:100%;color:var(--muted);padding:20px;text-align:center}
@media (max-width:560px){.pin .pn{display:none}.pin{padding:3px}.hint{display:none}}

.intro{color:var(--muted);margin:0;max-width:62ch}
.list{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.item{display:flex;gap:14px;align-items:center;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 16px;transition:border-color .15s}
.item:hover{border-color:var(--jade)}
.item .big{flex:none;width:46px;height:46px;display:grid;place-items:center;border:2.5px solid var(--seal);color:var(--seal);border-radius:8px;font-size:24px;font-weight:700}
.item.done .big{background:var(--seal);color:var(--surface)}
.item.locked .big{border-color:var(--muted);color:var(--muted)}
.item b{display:block;font-size:19px}
.item small{font-family:var(--f-ui);font-size:13px;color:var(--muted)}
.cta{background:var(--jade-soft);border:1px dashed var(--jade);border-radius:14px;padding:16px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}

/* login gate */
#gate{position:fixed;inset:0;z-index:40;background:var(--bg);overflow-y:auto;display:grid;place-items:center;
  padding:calc(20px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.pass{width:min(440px,100%);background:var(--slip);color:var(--slip-ink);border:3px double var(--cord);border-radius:12px;padding:28px clamp(18px,5vw,34px);display:flex;flex-direction:column;gap:14px}
.pass h1{font-size:40px;letter-spacing:.2em;text-align:center}
.pass .eyebrow{font-family:var(--f-ui);font-size:12px;letter-spacing:.2em;text-align:center;opacity:.8}
.pass p{margin:0}
.pass input{background:var(--surface);color:var(--ink)}
.pass .recent{display:flex;flex-wrap:wrap;gap:8px}
.pass .recent button{background:var(--surface);color:var(--ink);border:1px solid var(--cord);border-radius:999px;padding:4px 14px;font-size:16px}
.pass .note{font-family:var(--f-ui);font-size:13px;opacity:.85}
.pass .status{font-family:var(--f-ui);font-size:13px;display:flex;gap:8px;align-items:center}
.pass .err{color:var(--seal);font-family:var(--f-ui);font-size:14px;min-height:1em}

/* sheet + quiz */
#sheet{position:fixed;inset:0;z-index:30;background:var(--scrim);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);overflow-y:auto;
  padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(32px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
#sheet .wrap{animation:rise .35s ease-out both}
@keyframes rise{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.back{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 14px;font-size:15px;font-family:var(--f-ui);color:var(--muted)}
.bar h2{font-size:24px;flex:1;min-width:0}
.bar h2 small{display:block;font-family:var(--f-ui);font-size:13px;color:var(--muted);font-weight:400;letter-spacing:.08em}
.prog{font-family:var(--f-ui);font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.dots{display:flex;gap:6px}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--jade)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px clamp(16px,4vw,28px);display:flex;flex-direction:column;gap:16px;box-shadow:0 10px 30px rgba(0,0,0,.08)}
.lvl-intro{color:var(--muted);margin:0;font-size:16px}
.q{font-size:21px;font-weight:700;margin:0}
.who{display:flex;gap:12px;align-items:center}
.avatar{flex:none;width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-size:24px;font-weight:700;color:var(--surface)}
.avatar.lian{background:var(--seal)} .avatar.lin{background:var(--jade)}
.act{margin:0}
.quote,.slip{background:var(--slip);color:var(--slip-ink);border-radius:6px;
  background-image:linear-gradient(90deg,transparent 7%,var(--cord) 7%,var(--cord) calc(7% + 2px),transparent calc(7% + 2px),transparent 93%,var(--cord) 93%,var(--cord) calc(93% + 2px),transparent calc(93% + 2px))}
.quote{padding:12px 9%;margin:0;font-size:18px}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;gap:12px;align-items:center;text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:12px 14px;min-height:52px;transition:border-color .15s,background .15s}
.opt:hover:not(:disabled){border-color:var(--jade)}
.optkey{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--jade-soft);color:var(--jade);font-family:var(--f-ui);font-size:14px;font-weight:700}
.opt.picked{border-color:var(--jade);background:var(--jade-soft)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft);opacity:.75}
.opt:disabled{cursor:default}
.slots,.pool{display:flex;flex-direction:column;gap:8px}
.slotrow{display:flex;gap:10px;align-items:center}
.num{flex:none;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--seal);color:var(--seal);font-family:var(--f-ui);font-weight:700;font-size:15px}
.empty{flex:1;min-height:52px;border:2px dashed var(--line);border-radius:6px;display:flex;align-items:center;padding:0 9%;color:var(--muted);font-size:15px}
.slip{flex:1;min-width:0;border:none;text-align:left;padding:12px 9%;min-height:52px;font-size:18px;box-shadow:0 2px 0 var(--cord)}
.slip small{display:block;font-size:14px;opacity:.8}
.slip.right{outline:3px solid var(--ok)} .slip.wrong{outline:3px solid var(--bad)}
.pool-label{font-family:var(--f-ui);font-size:13px;color:var(--muted);letter-spacing:.08em}
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px}
.match .col{display:flex;flex-direction:column;gap:10px;min-width:0}
.tile{position:relative;background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:10px;font-size:20px;min-height:52px}
.tile.sel{border-color:var(--jade);background:var(--jade-soft)}
.tile.done{border-color:var(--ok);background:var(--ok-soft);cursor:default}
.tile.wrong{border-color:var(--bad);background:var(--bad-soft)}
.tile .tag{position:absolute;top:-9px;right:-9px;width:22px;height:22px;border-radius:50%;background:var(--ok);color:var(--surface);font-family:var(--f-ui);font-size:12px;display:grid;place-items:center}
.match.long .tile{font-size:16px;text-align:left;line-height:1.45}
.cloze{margin:0;font-size:19px;line-height:2.4}
.blank{display:inline-block;min-width:4.5em;margin:0 3px;padding:1px 10px;border:none;border-bottom:3px solid var(--jade);border-radius:6px 6px 0 0;background:var(--jade-soft);font-size:18px;line-height:1.6}
.blank.sel{background:var(--seal-soft);border-bottom-color:var(--seal)}
.blank.right{background:var(--ok-soft);border-bottom-color:var(--ok)}
.blank.wrong{background:var(--bad-soft);border-bottom-color:var(--bad)}
.bank{display:flex;flex-wrap:wrap;gap:10px}
.word{background:var(--slip);color:var(--slip-ink);border:none;border-radius:6px;padding:8px 16px;font-size:18px;box-shadow:0 2px 0 var(--cord)}
.word:disabled{opacity:.3;cursor:default}
textarea,input[type=text]{width:100%;box-sizing:border-box;font:inherit;color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:12px;padding:12px}
textarea{min-height:110px;resize:vertical}
.ideas{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.btn{background:var(--jade);color:var(--surface);border:none;border-radius:999px;padding:10px 22px;font-size:18px;font-weight:700;min-height:46px}
.btn:disabled{opacity:.4;cursor:default}
.btn.ghost{background:none;color:var(--jade);border:2px solid var(--jade)}
.btn.red{background:var(--seal)}
.fb{border-radius:12px;padding:12px 14px;font-size:17px}
.fb:empty{display:none}
.fb.ok{background:var(--ok-soft);border-left:5px solid var(--ok)}
.fb.no{background:var(--bad-soft);border-left:5px solid var(--bad)}
.fb strong{display:block;font-size:19px}
.done-card{align-items:center;text-align:center;padding-block:36px}
.stamp{width:120px;height:120px;border:5px solid var(--seal);border-radius:14px;display:grid;place-items:center;color:var(--seal);font-size:66px;font-weight:700;transform:rotate(-8deg);animation:stamp .5s cubic-bezier(.2,1.6,.4,1) both}
@keyframes stamp{from{transform:scale(2.2) rotate(-20deg);opacity:0}to{transform:scale(1) rotate(-8deg);opacity:1}}
.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-3px)}}
.edict{background:var(--slip);color:var(--slip-ink);border-radius:10px;padding:28px clamp(18px,5vw,40px);border:3px double var(--cord);display:flex;flex-direction:column;gap:14px;text-align:center}
.edict h2{font-size:30px;letter-spacing:.3em}
.edict .rank{font-size:clamp(26px,6vw,36px);font-weight:700;color:var(--seal)}
.edict .name{font-size:28px;font-weight:700;border-bottom:2px solid var(--cord);display:inline-block;min-width:6em;padding:0 .4em}
.edict .royal{align-self:flex-end;width:78px;height:78px;border:4px solid var(--seal);color:var(--seal);border-radius:8px;display:grid;place-items:center;font-size:20px;line-height:1.1;font-weight:700;transform:rotate(6deg);white-space:pre-line}
@media (max-width:440px){.match{gap:8px}.tile{font-size:18px;padding:8px}.q{font-size:19px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

</head>
<body>
<div class="page">
  <header class="top" id="hud"></header>
  <section class="stage" id="stage" aria-label="3D 地圖">
    <div class="pins" id="pins"></div>
    <span class="hint">拖曳轉動・滾輪或雙指縮放・點地標前進</span>
    <div class="stage-ctl"><button id="up-btn" hidden>回上一層</button><button id="recenter">回到全景</button></div>
    <div class="toast" id="toast" hidden></div>
  </section>
  <div id="below" class="page" style="gap:14px"></div>
</div>
<div id="sheet" hidden><div class="wrap" id="app"></div></div>
<div id="gate">
  <form class="pass" id="gate-form" autocomplete="off">
    <div class="eyebrow">冒險者通行證</div>
    <h1>學習大陸</h1>
    <p>輸入你的冒險者名稱。下次用同一個名稱，在任何裝置都能接著玩。</p>
    <label for="acct-name" class="note">冒險者名稱（1～20 字，不需要密碼）</label>
    <input type="text" id="acct-name" maxlength="20" placeholder="例如：小明">
    <div class="recent" id="recent"></div>
    <div class="err" id="gate-err" aria-live="polite"></div>
    <button class="btn red" id="gate-go" type="submit">進入大陸</button>
    <div class="status" id="gate-status"><span class="dot"></span><span>正在連線雲端⋯⋯</span></div>
  </form>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<!-- 進度保存：在 config.js 填入 Google Apps Script 網址；留空則存在瀏覽器 -->
<script src="config.js"></script>
<script src="db-gas.js"></script>
<script>
'use strict';
/* ================= utilities ================= */
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pick=a=>a[Math.floor(Math.random()*a.length)];
function shuffle(a){const b=a.slice();for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
function shuffleDiff(a){if(a.length<2)return a.slice();let b;do{b=shuffle(a)}while(b.every((x,i)=>x===a[i]));return b}
const ZH='零一二三四五六七八九';
function zhNum(n){if(n<10)return ZH[n];if(n<20)return '十'+(n%10?ZH[n%10]:'');return ZH[Math.floor(n/10)]+'十'+(n%10?ZH[n%10]:'');}
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
const OK=['答對了！','好眼力！','太厲害了！','完全正確！','真聰明！'];
const NO=['再想想看','差一點點','回課文找找線索'];
const LS={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const gradeOrder=g=>(parseInt(g,10)||0)*2+(/下/.test(g)?1:0);
let toastT;function toast(msg){const t=$('toast');t.textContent=msg;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,2600);}

/* ================= content ================= */
let CAT=null; const LESSONS={};
async function loadJSON(u){const r=await fetch(u,{cache:'no-cache'});if(!r.ok)throw new Error(u+' '+r.status);return r.json();}
async function getLesson(entry){if(!LESSONS[entry.id])LESSONS[entry.id]=await loadJSON(entry.file);return LESSONS[entry.id];}
const lessonTotal=l=>l.levels.reduce((n,lv)=>n+lv.steps.length,0);
const findSubject=id=>CAT.subjects.find(s=>s.id===id);
const findEntry=id=>{for(const s of CAT.subjects)for(const e of s.lessons)if(e.id===id)return {s,e};return null;};

/* ================= accounts + progress ================= */
const Store={mode:'pending',db:null,pid:null,name:'',key:'',progress:{},timers:{},chains:{}};
const normName=s=>s.normalize('NFKC').trim().replace(/\s+/g,' ');
const nameKey=s=>'h-'+[...new TextEncoder().encode(normName(s).toLowerCase())].map(b=>b.toString(16).padStart(2,'0')).join('');
function newId(){try{return 'p-'+crypto.randomUUID();}catch(e){return 'p-'+Date.now().toString(36)+Math.random().toString(36).slice(2,12);}}
function lp(lid){return Store.progress[lid]||(Store.progress[lid]={stars:{},done:{},answers:{}});}
const lessonStars=lid=>Object.values(lp(lid).stars).reduce((a,b)=>a+b,0);
const totalStars=()=>Object.keys(Store.progress).reduce((n,k)=>n+lessonStars(k),0);

async function connectDb(){
  if(window.LEARNLAND_DB)return window.LEARNLAND_DB;
  if(!window.claude||!window.claude.use)return null;
  try{return await Promise.race([window.claude.use('db'),new Promise(r=>setTimeout(()=>r(null),6000))]);}catch(e){return null;}
}
async function claimAccount(key,name){
  const ref=Store.db.doc('accounts/'+key);
  let s=await ref.get();
  if(s.exists&&s.data().pid)return s.data().pid;
  for(let i=0;i<4;i++){
    const lease=await ref.acquire({holder:newId(),ttlMs:5000});
    s=await ref.get();
    if(s.exists&&s.data().pid)return s.data().pid;
    if(lease.acquired){
      const pid=newId(),now=Date.now();
      await ref.set({name,pid,createdAt:now});
      await Store.db.doc('players/'+pid).set({name,createdAt:now});
      return pid;
    }
    await new Promise(r=>setTimeout(r,1200));
  }
  throw {code:'busy'};
}
async function login(raw){
  const name=normName(raw),key=nameKey(raw);
  Store.name=name;Store.key=key;Store.progress={};Store.cloudNote=false;Store.sync=null;
  if(Store.db){
    try{
      Store.pid=await claimAccount(key,name);
      const snap=await Store.db.collection('players/'+Store.pid+'/lessons').get();
      snap.docs.forEach(d=>{const x=d.data()||{};Store.progress[d.id]={stars:{...(x.stars||{})},done:{...(x.done||{})},answers:{...(x.answers||{})}};});
      Store.mode='cloud';
    }catch(e){console.warn('cloud login failed',e);Store.mode='local';Store.cloudNote=true;}
  }else Store.mode='local';
  if(Store.mode==='local'){Store.pid=null;Store.progress=LS.get('ll-progress-'+key)||{};}
  const rec=(LS.get('ll-recent')||[]).filter(n=>nameKey(n)!==key);rec.unshift(name);LS.set('ll-recent',rec.slice(0,5));
}
function setSync(st){Store.sync=st;const el=$('sync');if(!el)return;
  const txt={ok:'已存到雲端',saving:'儲存中⋯⋯',err:'雲端儲存失敗，先存在這台裝置',local:'進度存在這台裝置'}[st]||'';
  el.innerHTML=`<span class="dot ${st}"></span>${txt}`;}
function save(lid){
  LS.set(Store.mode==='cloud'?'ll-backup-'+Store.key:'ll-progress-'+Store.key,Store.progress);
  if(Store.mode!=='cloud'){setSync('local');return;}
  setSync('saving');clearTimeout(Store.timers[lid]);Store.timers[lid]=setTimeout(()=>flush(lid),700);
}
function flush(lid){
  clearTimeout(Store.timers[lid]);delete Store.timers[lid];
  const body=JSON.parse(JSON.stringify(lp(lid)));body.updatedAt=Date.now();
  const prev=Store.chains[lid]||Promise.resolve();
  Store.chains[lid]=prev.then(()=>Store.db.doc('players/'+Store.pid+'/lessons/'+lid).set(body))
    .then(()=>{if(!Object.keys(Store.timers).length)setSync('ok');})
    .catch(e=>{console.warn('save failed',e);setSync('err');});
}
addEventListener('pagehide',()=>Object.keys(Store.timers).forEach(flush));

const sheet=$('sheet'),app=$('app');
function openSheet(){if(sheet.hidden){sheet.hidden=false;document.body.style.overflow='hidden';}}
function closeSheet(fly){if(sheet.hidden)return;sheet.hidden=true;document.body.style.overflow='';
  if(NAV.view==='lesson'){hud();renderLessonList();if(G){G.refresh();if(fly)G.home();}}}
const toTop=()=>sheet.scrollTo({top:0,behavior:reduced?'auto':'smooth'});

function level(li,si){
  openSheet();
  const L=NAV.lesson,lv=L.levels[li],st=lv.steps[si],P=lp(L.id);
  app.innerHTML=`
    <div class="bar"><button class="back" id="back">← 回到${esc(L.scene&&L.scene.name||'地圖')}</button><h2><small>第${zhNum(li+1)}關・${esc(lv.place)}</small>${esc(lv.seal)}・${esc(lv.title)}</h2>
      <span class="dots">${lv.steps.map((_,i)=>`<i class="${i<=si?'on':''}"></i>`).join('')}</span><span class="prog">${si+1}/${lv.steps.length}</span></div>
    <section class="card">
      ${si===0&&lv.intro?`<p class="lvl-intro">${esc(lv.intro)}</p>`:''}
      <div id="body"></div><div class="fb" id="fb" aria-live="polite"></div>
      <div class="row"><button class="btn" id="next" hidden>${si+1<lv.steps.length?'下一題 →':'過關！'}</button></div>
    </section>`;
  $('back').onclick=()=>closeSheet(true);
  const body=$('body'),fb=$('fb'),next=$('next'),key=lv.id+'/'+st.id;
  const ctx={key,lessonId:L.id,
    wrong(msg){fb.className='fb no';fb.innerHTML=`<strong>${pick(NO)}</strong>${msg||''}`;},
    solved(first,explain){P.stars[key]=Math.max(P.stars[key]||0,first?1:0);save(L.id);
      fb.className='fb ok';fb.innerHTML=`<strong>${first?'★ ':''}${pick(OK)}</strong>${esc(explain||'')}`;
      next.hidden=false;next.focus({preventScroll:true});}};
  next.onclick=()=>{if(si+1<lv.steps.length){level(li,si+1);toTop();}else{P.done[lv.id]=true;save(L.id);levelDone(li);toTop();}};
  (STEP[st.type]||stepUnknown)(st,body,ctx);
}
function stepUnknown(st,body,ctx){body.innerHTML=`<p>這一題的題型「${esc(st.type)}」還沒有支援，先跳過吧。</p>`;ctx.solved(false,'');}
function qHead(st){let h='';
  if(st.who){const lian=st.who==='lian';h+=`<div class="who"><span class="avatar ${st.who}">${lian?'廉':'藺'}</span><p class="act"><b>${lian?'廉頗':'藺相如'}</b>：${esc(st.act)}</p></div>`;}
  if(st.quote)h+=`<p class="quote">${esc(st.quote)}</p>`;return h+`<p class="q">${esc(st.q)}</p>`;}
const col=inner=>`<div style="display:flex;flex-direction:column;gap:14px">${inner}</div>`;

function stepMC(st,body,ctx){
  const multi=Array.isArray(st.ans);let tries=0;
  body.innerHTML=col(`${qHead(st)}<div class="opts">${st.opts.map((o,i)=>`<button class="opt" data-i="${i}"><span class="optkey">${'ABCDEF'[i]}</span><span>${esc(o)}</span></button>`).join('')}</div>
    ${multi?'<div class="row"><button class="btn" id="mc-check" disabled>確認答案</button></div>':''}`);
  const btns=[...body.querySelectorAll('.opt')],hint=st.where?`提示：回課文${st.where}找找看。`:'';
  if(!multi){btns.forEach(b=>b.onclick=()=>{const i=+b.dataset.i;
    if(i===st.ans){btns.forEach(x=>x.disabled=true);b.classList.add('right');ctx.solved(tries===0,st.explain);}
    else{tries++;b.classList.add('wrong','shake');b.disabled=true;ctx.wrong(hint);}});}
  else{const chk=body.querySelector('#mc-check');
    btns.forEach(b=>b.onclick=()=>{b.classList.toggle('picked');chk.disabled=!body.querySelector('.opt.picked');});
    chk.onclick=()=>{const sel=btns.filter(b=>b.classList.contains('picked')).map(b=>+b.dataset.i).sort(),ans=[...st.ans].sort();
      if(sel.length===ans.length&&sel.every((v,i)=>v===ans[i])){btns.forEach(b=>{b.disabled=true;if(ans.includes(+b.dataset.i)){b.classList.remove('picked');b.classList.add('right')}});chk.hidden=true;ctx.solved(tries===0,st.explain);}
      else{tries++;const o=body.querySelector('.opts');o.classList.remove('shake');void o.offsetWidth;o.classList.add('shake');ctx.wrong((sel.length<ans.length?'好像還少選了一個。':'有一個選項不對喔。')+hint);}};}
}
function stepOrder(st,body,ctx){
  const items=st.items.map(x=>typeof x==='string'?{t:x}:x);
  let pool=shuffleDiff(items.map((_,i)=>i)),placed=[],tries=0,locked=false;
  body.innerHTML=col(`${qHead(st)}<div class="slots" id="slots"></div><span class="pool-label">點一下放上去，放錯了再點一次拿回來</span><div class="pool" id="pool"></div>
    <div class="row"><button class="btn ghost" id="ord-reset">全部重排</button><button class="btn" id="ord-check" disabled>確認順序</button></div>`);
  const slotsEl=body.querySelector('#slots'),poolEl=body.querySelector('#pool'),chk=body.querySelector('#ord-check');
  const label=it=>`${esc(it.t)}${it.d?`<small>${esc(it.d)}</small>`:''}`;
  function draw(marks){
    slotsEl.innerHTML=items.map((_,i)=>`<div class="slotrow"><span class="num">${i+1}</span>${placed[i]!==undefined?`<button class="slip ${marks?(placed[i]===i?'right':'wrong'):''}" data-s="${i}">${label(items[placed[i]])}</button>`:'<span class="empty">放在這裡</span>'}</div>`).join('');
    poolEl.innerHTML=pool.map(p=>`<button class="slip" data-p="${p}">${label(items[p])}</button>`).join('');
    chk.disabled=placed.length<items.length||locked;
    slotsEl.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{if(locked)return;const s=+b.dataset.s;pool.push(placed[s]);placed.splice(s,1);draw();});
    poolEl.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{if(locked)return;const p=+b.dataset.p;placed.push(p);pool=pool.filter(x=>x!==p);draw();});}
  body.querySelector('#ord-reset').onclick=()=>{if(locked)return;pool=shuffleDiff(items.map((_,i)=>i));placed=[];draw();};
  chk.onclick=()=>{if(placed.every((p,i)=>p===i)){locked=true;draw(true);body.querySelector('.pool-label').hidden=true;body.querySelector('#ord-reset').hidden=true;chk.hidden=true;ctx.solved(tries===0,st.explain);}
    else{tries++;draw(true);ctx.wrong('紅框的位置不對，點它拿回來再試一次。');}};
  draw();
}
function stepMatch(st,body,ctx){
  const left=st.pairs.map(p=>p[0]),right=shuffleDiff(st.pairs.map(p=>p[1]));let sl=null,sr=null,mistakes=0,matched=0;
  body.innerHTML=col(`${qHead(st)}<div class="match ${st.long?'long':''}"><div class="col">${left.map((w,i)=>`<button class="tile" data-l="${i}">${esc(w)}</button>`).join('')}</div>
    <div class="col">${right.map((w,i)=>`<button class="tile" data-r="${i}">${esc(w)}</button>`).join('')}</div></div>`);
  const Lb=[...body.querySelectorAll('[data-l]')],Rb=[...body.querySelectorAll('[data-r]')];
  const sel=()=>{Lb.forEach((b,i)=>b.classList.toggle('sel',i===sl));Rb.forEach((b,i)=>b.classList.toggle('sel',i===sr));};
  function attempt(){if(sl===null||sr===null)return;const a=Lb[sl],b=Rb[sr];
    if(st.pairs[sl][1]===right[sr]){matched++;[a,b].forEach(x=>{x.classList.remove('sel');x.classList.add('done');x.disabled=true;x.insertAdjacentHTML('beforeend',`<span class="tag">${matched}</span>`)});sl=sr=null;
      if(matched===left.length)ctx.solved(mistakes===0,st.explain);else{const fb=$('fb');fb.className='fb ok';fb.innerHTML=`<strong>配對成功！</strong>還剩 ${left.length-matched} 組。`;}}
    else{mistakes++;[a,b].forEach(x=>{x.classList.add('wrong','shake');setTimeout(()=>x.classList.remove('wrong','shake'),500)});ctx.wrong(`「${esc(left[sl])}」和「${esc(right[sr])}」配不起來喔。`);sl=sr=null;sel();}}
  Lb.forEach((b,i)=>b.onclick=()=>{sl=i;sel();attempt();});Rb.forEach((b,i)=>b.onclick=()=>{sr=i;sel();attempt();});
}
function stepOpen(st,body,ctx){
  const P=lp(ctx.lessonId);
  body.innerHTML=col(`${qHead(st)}<textarea id="open-${esc(ctx.key.replace(/[^\w-]/g,'_'))}" placeholder="把你的想法寫在這裡⋯⋯"></textarea>
    <div class="row"><button class="btn" id="reveal" disabled>寫好了，看看參考想法</button></div>
    <div id="ideas" hidden><p class="pool-label">參考想法（答案不只一種）</p><ul class="ideas">${st.ideas.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`);
  const ta=body.querySelector('textarea'),rv=body.querySelector('#reveal');
  ta.value=P.answers[ctx.key]||'';let t;
  const upd=()=>{rv.disabled=ta.value.trim().length<4;};
  ta.oninput=()=>{upd();clearTimeout(t);t=setTimeout(()=>{P.answers[ctx.key]=ta.value;save(ctx.lessonId);},900);};upd();
  rv.onclick=()=>{P.answers[ctx.key]=ta.value;body.querySelector('#ideas').hidden=false;rv.hidden=true;ctx.solved(true,'說出自己的看法，再加上課文或生活中的理由，就是很棒的回答。和你的想法比一比吧！');};
}
function stepCloze(st,body,ctx){
  const parts=st.text.split(/\[(.+?)\]/),answers=parts.filter((_,i)=>i%2),bank=shuffle([...answers,...(st.extra||[])]);
  let filled=answers.map(()=>null),sel=0,tries=0,locked=false;
  body.innerHTML=col(`${qHead(st)}<p class="cloze" id="cz"></p><span class="pool-label">語詞庫</span><div class="bank" id="bank"></div>
    <div class="row"><button class="btn" id="cz-check" disabled>確認答案</button></div>`);
  const cz=body.querySelector('#cz'),bk=body.querySelector('#bank'),chk=body.querySelector('#cz-check');
  function draw(marks){let k=-1;
    cz.innerHTML=parts.map((p,i)=>{if(i%2===0)return esc(p);k++;const m=marks?(bank[filled[k]]===answers[k]?'right':'wrong'):'';
      return `<button class="blank ${sel===k&&!locked?'sel':''} ${m}" data-b="${k}">${filled[k]!==null?esc(bank[filled[k]]):'　　'}</button>`;}).join('');
    bk.innerHTML=bank.map((w,i)=>`<button class="word" data-w="${i}" ${filled.includes(i)||locked?'disabled':''}>${esc(w)}</button>`).join('');
    chk.disabled=filled.includes(null)||locked;
    cz.querySelectorAll('[data-b]').forEach(b=>b.onclick=()=>{if(locked)return;const k=+b.dataset.b;if(filled[k]!==null)filled[k]=null;sel=k;draw();});
    bk.querySelectorAll('[data-w]').forEach(b=>b.onclick=()=>{if(locked)return;if(sel<0||filled[sel]!==null)sel=filled.indexOf(null);if(sel<0)return;filled[sel]=+b.dataset.w;sel=filled.indexOf(null);draw();});}
  chk.onclick=()=>{if(filled.every((w,k)=>bank[w]===answers[k])){locked=true;draw(true);chk.hidden=true;ctx.solved(tries===0,st.explain);}
    else{tries++;draw(true);ctx.wrong('紅色的空格再想想，點一下就能拿出來換掉。');}};
  draw();
}
const STEP={mc:stepMC,order:stepOrder,match:stepMatch,open:stepOpen,cloze:stepCloze};

function levelDone(li){
  const L=NAV.lesson,lv=L.levels[li],P=lp(L.id),got=lv.steps.reduce((n,st)=>n+(P.stars[lv.id+'/'+st.id]||0),0),n=nextLevel(L);
  if(G)G.refresh();
  app.innerHTML=`<section class="card done-card"><div class="stamp" aria-hidden="true">${esc(lv.seal)}</div>
    <h2>${esc(lv.place)}　過關！</h2><p class="lvl-intro">這一關得到 <span class="star">★</span> ${got} / ${lv.steps.length}，屋頂插上了印章旗。</p>
    <div class="row" style="justify-content:center"><button class="btn ghost" id="d-home">回到${esc(L.scene&&L.scene.name||'地圖')}</button>

    if(theme==='ancient'){
      [[0,-6,12,1],[0,6,12,1],[-6,0,1,12],[6,0,1,12]].forEach(([x,z,w,d])=>g.add(box(w,1.6,d,C.wallc,x,y+.8,z)));
      let h=y;[5.4,4.2,3].forEach((s,i)=>{g.add(box(s*.72,1.5,s*.72,C.plaster,0,h+.75,0));h+=1.5;g.add(pyr(s+.6,s+.6,1.3,i===2?C.gold:C.tile,h));h+=1.05;});
      [[-9,-8],[9,-8],[-9,8],[9,8]].forEach(([x,z])=>{g.add(box(2.4,1.6,2.2,C.plaster,x,y+.8,z));g.add(pyr(3,2.8,1.2,C.tile,y+1.6));g.children[g.children.length-1].position.set(x,y+1.6+.6,z);});
      top=h+1;
    }else if(theme==='forest'){
      g.add(cone(6.5,11,C.leaf2,-4,y+5.5,-3,7));g.add(cone(2.2,3.6,C.snow,-4,y+9.2,-3,7));
      const pond=new T.Mesh(new T.CircleGeometry(3,20),M(C.water));pond.rotation.x=-Math.PI/2;pond.position.set(5,y+.05,4);g.add(pond);
      const r=rng(11),tp=[];for(let i=0;i<14;i++){const a=r()*Math.PI*2,d=7+r()*6;tp.push([Math.cos(a)*d,Math.sin(a)*d,.7+r()*.4,y]);}trees(g,tp);
      top=y+12;
    }else{
      const cols=[C.c3,C.c2,C.c1,C.slate,C.c3];for(let i=0;i<5;i++)for(let j=0;j<=i;j++)g.add(box(2.2,2.2,2.2,cols[(i+j)%5],-7+i*2.6,y+1.1+j*2.2,4));
      g.add(pyr(6,6,5.5,C.c3,y));g.children[g.children.length-1].position.set(5,y+2.75,-4);
      g.add(ball(2,C.c1,-5,y+2,-5));g.add(cyl(1.4,1.4,5,C.c2,1,y+2.5,-8,16));
      top=y+12;
    }
    const b=banner(seal,'#b5321d','#f7efd9',6);b.position.set(10,y,-2);g.add(b);
    g.userData.top=top;return g;
  }
  function buildWorld(cat){
    const group=new T.Group();
    const sea=new T.Mesh(new T.PlaneGeometry(1200,1200),M(C.sea));sea.rotation.x=-Math.PI/2;sea.position.y=.3;group.add(sea);
    const subs=cat.subjects,n=subs.length,R=n<2?0:Math.max(32,n*11);
    const pos=subs.map((s,i)=>{const a=Math.PI/2+i*2*Math.PI/n;return [Math.cos(a)*R,Math.sin(a)*R];});
    for(let i=0;i<n&&n>1;i++){const a=pos[i],b=pos[(i+1)%n];if(n===2&&i===1)break;const dx=b[0]-a[0],dz=b[1]-a[1],L=Math.hypot(dx,dz);
      const br=box(L-26,.6,3,C.wood,(a[0]+b[0])/2,2.4,(a[1]+b[1])/2);br.rotation.y=-Math.atan2(dz,dx);group.add(br);}
    const clouds=[];const r=rng(5);for(let i=0;i<7;i++){const c=new T.Group();for(let k=0;k<4;k++)c.add(ball(2+r()*2,C.cloud,k*2.6-4,r()*1.2,r()*2));c.position.set((r()*2-1)*90,26+r()*10,(r()*2-1)*90);c.userData.v=.6+r();group.add(c);clouds.push(c);}
    const places=subs.map((s,i)=>{const g=island(s.theme,s.seal);g.position.set(pos[i][0],0,pos[i][1]);group.add(g);
      return mark(g,i,()=>{const n2=s.lessons.length,st=s.lessons.reduce((a,e)=>a+lessonStars(e.id),0);
        return {seal:s.seal,name:s.name+s.region,sub:n2?`${n2} 課・★${st}`:'建造中',cls:n2?'':'locked'};},()=>enterSubject(s.id));});
    places.forEach((p,i)=>p.id=subs[i].id);
    return {group,places,visitD:60,home:{x:0,z:0,d:R?R*3.4:80,az:.4,pol:.95,min:40,max:260},
      update(dt){clouds.forEach(c=>{c.position.x+=dt*c.userData.v;if(c.position.x>110)c.position.x=-110;});}};
  }

  /* ================= SUBJECT VIEW ================= */
  function landmark(theme,ch,ok=true){
    const g=new T.Group();
    if(!ok){[[0,-3,7,.2],[0,3,7,.2],[-3.5,0,.2,6],[3.5,0,.2,6]].forEach(([x,z,w,d])=>g.add(box(w,.9,d,C.wood,x,.45,z)));
      g.add(flat(6.6,5.6,C.earth,0,0,.06));const b=banner('？','#8a8f88','#f7efd9',3.4);b.position.set(-1,0,0);g.add(b);g.userData.top=3.6;return g;}
    if(theme==='forest'){g.add(cyl(.9,1.2,6,C.trunk,0,3,0,8));g.add(cone(4.5,6,C.leaf,0,8,0,8));g.add(box(5,.4,5,C.wood,0,5,0));g.add(box(2.6,2,2.6,C.plaster,0,6.2,0));}
    else if(theme==='blocks'){for(let j=0;j<4;j++)g.add(box(4-j*.6,2,4-j*.6,[C.c3,C.c2,C.c1,C.slate][j],0,1+j*2,0));}
    else{g.add(box(8,1,8,C.stone,0,.5,0));[[-3,-3],[3,-3],[-3,3],[3,3]].forEach(([x,z])=>g.add(cyl(.28,.28,3.6,C.red,x,2.8,z,8)));
      g.add(box(9,.3,9,C.tile,0,4.75,0));g.add(pyr(9,9,2,C.tile,4.9));g.add(pyr(5,5,1.6,C.tile,6.6));}
    const b=banner(ch,'#b5321d','#f7efd9',5.5);b.position.set(4.6,0,3.2);g.add(b);
    g.userData.top=theme==='forest'?11:theme==='blocks'?8:8.2;return g;
  }
  function buildSubject(s,entries){
    const group=new T.Group(),theme=s.theme;
    const groundC=theme==='forest'?C.forestGround:theme==='blocks'?C.blockGround:C.grass;
    group.add(flat(600,600,groundC,0,0,0));
    const slots=entries.length+2,span=Math.max(60,slots*16);
    const pts=[];for(let k=0;k<slots;k++){const t=slots<2?0:k/(slots-1);pts.push(new T.Vector3(Math.sin(k*1.3)*18,0,span/2-t*span));}
    const curve=new T.CatmullRomCurve3([pts[0].clone().add(new T.Vector3(0,0,14)),...pts,pts[pts.length-1].clone().add(new T.Vector3(0,0,-14))]);
    const samples=curve.getSpacedPoints(slots*22);
    const stones=new T.InstancedMesh(new T.CylinderGeometry(1.5,1.5,.18,10),M(C.road),samples.length);const dm=new T.Object3D();
    samples.forEach((p,i)=>{dm.position.set(p.x,.09,p.z);dm.updateMatrix();stones.setMatrixAt(i,dm.matrix);});stones.receiveShadow=true;group.add(stones);
    const r=rng(3+slots),tp=[];const near=(x,z)=>samples.some(p=>Math.hypot(p.x-x,p.z-z)<6)||pts.some(p=>Math.hypot(p.x-x,p.z-z)<10);
    for(let i=0;i<600&&tp.length<70;i++){const x=(r()*2-1)*70,z=(r()*2-1)*(span/2+30);if(!near(x,z))tp.push([x,z,.8+r()*.7]);}
    if(theme==='blocks'){tp.forEach(([x,z,s2],i)=>{if(i%2)group.add(box(2*s2,2*s2,2*s2,[C.c3,C.c2,C.c1,C.slate][i%4],x,s2,z));});}
    else trees(group,tp,theme==='forest'?C.leaf:C.leaf2);
    const places=[];
    for(let k=0;k<slots;k++){const e=entries[k],ok=!!e;const g=landmark(theme,ok?zhNum(e.no):'？',ok);
      g.position.set(pts[k].x+(k%2?6:-6),0,pts[k].z);g.rotation.y=k%2?-.35:.35;group.add(g);
      const p=mark(g,k,ok?()=>{const L=LESSONS[e.id],done=L&&nextLevel(L)<0,first=entries.findIndex(x=>{const l=LESSONS[x.id];return !l||nextLevel(l)>=0;});
        return {seal:zhNum(e.no),name:`第${zhNum(e.no)}課 ${e.title}`,sub:`${e.grade}${L?`・★${lessonStars(e.id)}/${lessonTotal(L)}`:''}`,cls:done?'done':(k===first?'next':'')};}
        :()=>({seal:'？',name:'即將開放',sub:'下一課',cls:'locked'}),ok?()=>enterLesson(e.id):()=>toast('這一課還在準備中，敬請期待！'));
      p.id=ok?e.id:null;places.push(p);}
    return {group,places,visitD:34,home:{x:0,z:0,d:Math.max(90,span*1.15),az:.55,pol:.9,min:30,max:Math.max(200,span*2.4)}};
  }

  /* ================= LESSON VIEW: ancient-city template ================= */
  function buildLesson(L){
    const group=new T.Group(),HALF=40;
    group.add(flat(600,600,C.grass,0,0,0));group.add(flat(HALF*2,HALF*2,C.earth,0,0,.02));
    [[0,-(HALF+5),HALF*2+18,7],[0,HALF+5,HALF*2+18,7],[-(HALF+5),0,7,HALF*2+4],[HALF+5,0,7,HALF*2+4]].forEach(([x,z,w,d])=>group.add(flat(w,d,C.water,x,z,.03)));
    group.add(box(7,.6,10,C.wood,0,.3,HALF+5));
    group.add(flat(6,HALF+6,C.road,0,6,.05));group.add(flat(HALF*2-6,5,C.road,0,4,.06));group.add(flat(20,8,C.road,0,-14,.05));
    const wallH=4.5,wt=2;
    [[0,-HALF,HALF*2+wt,wt],[-HALF,0,wt,HALF*2],[HALF,0,wt,HALF*2],[-(HALF+6)/2-1,HALF,HALF-6+wt,wt],[(HALF+6)/2+1,HALF,HALF-6+wt,wt]].forEach(([x,z,w,d])=>group.add(box(w,wallH,d,C.wallc,x,wallH/2,z)));
    const crenPos=[];for(let x=-HALF;x<=HALF;x+=3){crenPos.push([x,-HALF]);if(Math.abs(x)>7)crenPos.push([x,HALF]);}for(let z=-HALF+3;z<HALF;z+=3){crenPos.push([-HALF,z]);crenPos.push([HALF,z]);}
    const cren=new T.InstancedMesh(new T.BoxGeometry(1.4,1,1.4),M(C.wallc),crenPos.length);cren.castShadow=true;const dm=new T.Object3D();
    crenPos.forEach(([x,z],i)=>{dm.position.set(x,wallH+.5,z);dm.updateMatrix();cren.setMatrixAt(i,dm.matrix);});group.add(cren);
    [[-1,-1],[1,-1],[-1,1],[1,1]].forEach(([a,b])=>{const t=hall(4,4,3,{plat:wallH,cols:2,rh:2});t.position.set(a*HALF,0,b*HALF);group.add(t);});
    for(let x=-30;x<=30;x+=10)[1,7].forEach(z=>{if(Math.abs(x)<4)return;group.add(cyl(.1,.1,3,C.wood,x,1.5,z,6));const l=new T.Mesh(new T.SphereGeometry(.45,10,8),lanternMat);l.position.set(x,3.1,z);group.add(l);});
    const SPOTS=[[0,HALF],[-15,16],[-17,-6],[17,-6],[15,16],[26,-24],[0,-25],[-28,-31],[-27,29],[27,28],[-31,-14],[32,-12],[14,-34],[-14,-34],[33,10],[-33,10]];
    const used=L.levels.slice(0,SPOTS.length);
    const busy=[[0,4,8,99],[0,6,8,80],[0,-14,22,12],...used.map((_,i)=>[SPOTS[i][0],SPOTS[i][1],15,13])];
    const free=(x,z)=>!busy.some(([bx,bz,w,d])=>Math.abs(x-bx)<w/2&&Math.abs(z-bz)<d/2)&&Math.abs(z-4)>4;
    const r=rng(7),tp=[];for(let i=0;i<600&&tp.length<40;i++){const x=(r()*2-1)*(HALF-4),z=(r()*2-1)*(HALF-4);if(free(x,z))tp.push([x,z,.8+r()*.6]);}
    for(let i=0;i<40;i++){const a=r()*Math.PI*2,d=HALF+16+r()*40;tp.push([Math.cos(a)*d,Math.sin(a)*d,1+r()*.8]);}trees(group,tp);
    const places=used.map((lv,i)=>{const spec=typeof lv.building==='string'?{type:lv.building}:(lv.building||{});
      const g=(BUILD[spec.type]||BUILD.hall)(spec);g.position.set(SPOTS[i][0],0,SPOTS[i][1]);
      const flag=banner(lv.seal,'#b5321d','#f7efd9',3.2);flag.position.set(0,g.userData.top-.6,0);flag.visible=false;g.add(flag);g.userData.flag=flag;group.add(g);
      const p=mark(g,i,()=>{const P=lp(L.id),done=!!P.done[lv.id];return {seal:lv.seal,name:lv.place,sub:'',cls:done?'done':(i===nextLevel(L)?'next':'')};},()=>enterLevel(i));
      p.idx=i;return p;});
    const cart=new T.Group();cart.add(box(2.6,1.3,1.7,C.wood,0,1.45,0));cart.add(box(2.9,.22,2,C.tile,0,2.3,0));
    const wheels=[-.95,.95].map(z=>{const w=cyl(.7,.7,.18,C.dark,0,.7,z,14);w.rotation.x=Math.PI/2;cart.add(w);return w;});
    cart.add(box(1.9,.9,.7,C.horse,3.4,1.55,0));cart.add(box(.5,.9,.45,C.horse,4.4,2.2,0));[[2.8,.3],[2.8,-.3],[4,.3],[4,-.3]].forEach(([x,z])=>cart.add(box(.18,1.1,.18,C.horse,x,.55,z)));
    cart.position.set(-26,0,5);group.add(cart);let dir=1,ang=0;
    return {group,places,visitD:38,home:{x:0,z:4,d:95,az:.62,pol:.95,min:28,max:160},
      refresh(){const P=lp(L.id);places.forEach((p,i)=>p.obj.userData.flag.visible=!!P.done[used[i].id]);},
      update(dt,now){const target=dir>0?0:Math.PI;if(Math.abs(ang-target)>.01){ang+=(dir>0?-1:1)*dt*2;if(dir>0&&ang<0)ang=0;if(dir<0&&ang>Math.PI)ang=Math.PI;}
        else{cart.position.x+=dir*dt*5;wheels.forEach(w=>w.rotation.y+=dt*7*dir);if(cart.position.x>27)dir=-1;if(cart.position.x<-27)dir=1;}
        cart.rotation.y=ang;cart.position.z=ang>Math.PI/2?3:5;
        places.forEach(p=>{const f=p.obj.userData.flag;if(f.visible)f.userData.cloth.rotation.y=Math.sin(now/500+p.obj.position.x)*.25;});}};
  }

  return {setView,refresh,visitBy,home:goHome,buildWorld,buildSubject,buildLesson};
}

/* ================= gate + boot ================= */
function showGate(){
  $('gate').hidden=false;document.body.style.overflow='hidden';
  const rec=LS.get('ll-recent')||[];
  $('recent').innerHTML=rec.map(n=>`<button type="button" data-n="${esc(n)}">${esc(n)}</button>`).join('');
  $('recent').querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>{$('acct-name').value=b.dataset.n;$('gate-form').requestSubmit();});
  $('acct-name').value=rec[0]||'';$('gate-err').textContent='';
  gateStatus();
}
function gateStatus(){
  const st=$('gate-status');
  if(Store.mode==='pending'){st.innerHTML='<span class="dot saving"></span><span>正在連線雲端⋯⋯</span>';return;}
  st.innerHTML=Store.db?'<span class="dot ok"></span><span>已連上雲端，進度會自動保存，換裝置也能接著玩。</span>'
    :'<span class="dot local"></span><span>目前沒有連上雲端，進度只會存在這台裝置。</span>';
}
$('gate-form').addEventListener('submit',async e=>{
  e.preventDefault();const raw=$('acct-name').value;const name=normName(raw);
  if(!name){$('gate-err').textContent='請先輸入冒險者名稱。';return;}
  if([...name].length>20){$('gate-err').textContent='名稱最多 20 個字。';return;}
  const go=$('gate-go');go.disabled=true;go.textContent='進入中⋯⋯';
  try{await dbReady;await catReady;await login(raw);}catch(err){console.warn(err);}
  if(!CAT){go.disabled=false;go.textContent='進入大陸';$('gate-err').textContent='讀取課程目錄失敗，請重新整理頁面。';return;}
  go.disabled=false;go.textContent='進入大陸';
  $('gate').hidden=true;document.body.style.overflow='';
  if(Store.mode==='local'&&Store.cloudNote)toast('雲端暫時無法使用，進度先存在這台裝置。');
  const h=decodeURIComponent(location.hash.slice(1));
  if(h&&findSubject(h)&&findSubject(h).lessons.length)goSubject(h);else if(h&&findEntry(h))goLesson(h);else goWorld();
});

let dbReady,catReady;
(async function boot(){
  try{G=init3D();}catch(e){console.warn(e);G=null;}
  if(!G)$('stage').innerHTML='<div class="nogl">這台裝置無法顯示 3D 地圖，請直接從下面的清單選擇。</div>';
  showGate();
  dbReady=connectDb().then(db=>{Store.db=db;Store.mode=db?'ready':'local';gateStatus();});
  catReady=loadJSON('content/catalog.json').then(c=>{CAT=c;}).catch(()=>{$('gate-err').textContent='讀取課程目錄失敗，請重新整理頁面。';});
})();
</script>
